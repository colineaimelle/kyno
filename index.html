document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

lay: swap;\n  src: url(\"4a758526-1834-49de-9be7-6f7685ffd64e\") format('woff2');\n  unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Syne';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"5ca56675-2b0c-4aca-9ae8-864778bda4b0\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Syne';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"2149d88c-f564-4a16-ae7e-ac9633207999\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n\n\n<style>\n:root {\n  /* Univers POP — vert frais en primaire, accents banane / bleu */\n  --sage:#2FA35E;        /* vert pop (primaire : CTA, accents titres, score) */\n  --sage-l:#7CCB95;      /* menthe (accents / hover / sur fond foncé) */\n  --sage-mist:#E4F4E8;   /* vert pâle (surfaces douces) */\n  --ecru:#FBFDF7;        /* surface très claire */\n  --sand:#DDE8DA;        /* lignes / bordures douces */\n  --honey:#7E8C80;       /* texte secondaire vert-gris doux */\n  --tabac:#2B3A2E;       /* encre forêt profonde (texte + surfaces foncées) */\n  --warm:#FCFDF8;        /* fond de base */\n  --dark:#233028;        /* footer */\n  --peach:#EC6592;       /* rose pop (eyebrows / accents récurrents) */\n  --banana:#FFCE2E;      /* jaune banane */\n  --banana-soft:#FFF1BF;\n  --blue:#3E8FC4;\n  --blue-soft:#DEEBF7;\n  --pink:#EC6592;        /* rose pop */\n  --pink-soft:#FBE2EB;\n  --orange:#F2843C;      /* orange pêche pop (contours / accents) */\n  --display:\"Syne\",system-ui,sans-serif;\n  --body:\"Manrope\",system-ui,sans-serif;\n}\n*{margin:0;padding:0;box-sizing:border-box;}\nhtml{scroll-behavior:smooth;}\nbody{font-family:var(--body);background:var(--warm);color:var(--tabac);font-weight:300;overflow-x:hidden;-webkit-font-smoothing:antialiased;}\n\n/* NAV */\nnav{\n  position:fixed;top:0;left:0;right:0;z-index:200;\n  height:56px;background:rgba(250,248,244,0.92);\n  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);\n  border-bottom:1px solid var(--sand);\n  display:flex;align-items:center;justify-content:space-between;\n  padding:0 48px;\n}\n.nav-logo{display:flex;align-items:center;gap:10px;text-decoration:none;}\n.logo-mark{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--sage);display:flex;align-items:center;justify-content:center;flex-shrink:0;}\n.logo-mark span{font-family:var(--display);font-weight:600;font-size:18px;color:var(--sage);line-height:1;margin-top:-1px;}\n.logo-word{font-family:var(--display);font-weight:600;font-size:21px;letter-spacing:0.04em;color:var(--tabac);}\n.nav-links{display:flex;align-items:center;gap:36px;}\n.nav-links a{font-size:12px;letter-spacing:0.1em;color:var(--tabac);text-decoration:none;opacity:0.7;transition:opacity 0.2s;font-weight:400;}\n.nav-links a:hover{opacity:1;}\n.nav-cta{font-family:var(--display);background:var(--sage);color:white;padding:10px 22px;border-radius:4px;font-size:12px;font-weight:600;letter-spacing:0.08em;text-decoration:none;transition:background 0.2s;border:2px solid var(--orange);nd 0.2s;opacity:1!important;}\n.nav-cta:hover{background:var(--sage-l);}\n.nav-espace{font-size:12px;letter-spacing:0.06em;color:var(--sage);text-decoration:none;font-weight:600;padding:8px 16px;border-radius:4px;border:1.5px solid var(--sage-l);transition:all 0.2s;font-family:var(--display);}\n.nav-espace:hover{background:var(--sage-mist);border-color:var(--sage);}\n\n/* HERO */\n.hero{min-height:100vh;padding-top:56px;display:grid;grid-template-columns:1.1fr 0.9fr;position:relative;overflow:hidden;}\n.hero-left{padding:96px 16px 80px 64px;display:flex;flex-direction:column;justify-content:center;gap:36px;position:relative;z-index:2;}\n.eyebrow{font-size:11px;letter-spacing:0.22em;text-transform:uppercase;color:var(--peach);display:flex;align-items:center;gap:14px;font-weight:600;}\n.eyebrow::before{content:'';width:28px;height:1px;background:var(--peach);flex-shrink:0;}\nh1{font-family:var(--display);font-size:56px;line-height:1.05;font-weight:600;color:var(--tabac);letter-spacing:-0.02em;}\nh1 em{font-style:normal;color:var(--sage);}\n.hero-desc{font-size:16px;line-height:1.85;color:var(--honey);max-width:430px;font-weight:300;}\n.hero-fineprint{font-size:11px;color:var(--honey);font-weight:400;letter-spacing:0.02em;margin-top:2px;}\n\n/* EARLY BIRD BADGE */\n.early-bird-wrap{display:flex;flex-direction:column;gap:12px;}\n.early-bird-badge{\n  display:inline-flex;align-items:center;gap:8px;\n  background:rgba(47,163,94,0.12);border:1px solid rgba(47,163,94,0.32);\n  color:var(--sage);padding:7px 14px;border-radius:4px;width:fit-content;\n  font-size:11px;letter-spacing:0.1em;text-transform:uppercase;font-weight:500;\n}\n.eb-dot{width:6px;height:6px;border-radius:50%;background:var(--sage);animation:pulse 2s infinite;}\n@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}\n.early-bird-counter{font-size:12px;color:var(--honey);opacity:0.75;font-weight:400;}\n.early-bird-counter strong{color:var(--tabac);font-weight:600;}\n\n.btn-main{\n  font-family:var(--display);\n  background:var(--sage);color:white;\n  padding:16px 26px;border-radius:4px;\n  font-size:14px;font-weight:600;letter-spacing:0.03em;\n  border:2px solid var(--orange);cursor:pointer;\n  text-decoration:none;display:inline-flex;align-items:center;justify-content:space-between;gap:16px;\n  transition:background 0.2s,transform 0.15s;\n}\n.btn-main:hover{background:var(--sage-l);transform:translateY(-1px);}\n.btn-price-wrap{display:flex;flex-direction:column;align-items:flex-end;gap:1px;}\n.btn-price-main{font-size:15px;font-weight:600;}\n.btn-price-sub{font-size:12px;opacity:0.7;font-weight:400;letter-spacing:0.02em;}\n\n.hero-proof{display:flex;gap:36px;padding-top:20px;border-top:1px solid var(--sand);}\n.proof-num{font-family:var(--display);font-size:30px;font-weight:600;color:var(--tabac);line-height:1;}\n.proof-lbl{font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--honey);margin-top:4px;font-weight:500;}\n\n/* HERO RIGHT */\n.hero-right{position:relative;background:var(--ecru);display:flex;align-items:center;justify-content:center;overflow:hidden;}\n.hero-right::before{content:'';position:absolute;top:-80px;right:-80px;width:360px;height:360px;border-radius:50%;background:var(--blue-soft);opacity:0.7;}\n.hero-right::after{content:'';position:absolute;bottom:-60px;left:-60px;width:240px;height:240px;border-radius:50%;background:var(--banana-soft);opacity:0.7;}\n.hero-viva{position:absolute;bottom:-6px;left:0px;width:240px;height:auto;z-index:1;filter:drop-shadow(0 14px 22px rgba(42,31,20,0.13));}\n.hero-card{position:relative;z-index:2;background:white;border-radius:20px;padding:32px;width:100%;max-width:400px;border:2.5px solid var(--pink);box-shadow:0 32px 72px rgba(42,31,20,0.1);margin-left:0;}\n.hero-card-stack{position:relative;z-index:2;margin-left:60px;margin-right:32px;display:flex;flex-direction:column;gap:14px;}\n.hero-pick{font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--honey);font-weight:600;padding-left:2px;}\n.hero-carousel{justify-content:flex-start;gap:10px;padding-left:2px;}\n.hero-carousel .breed-ava .ph{width:46px;height:46px;border-width:2px;}\n.hero-carousel .breed-ava .nm{display:none;}\n.hero-carousel .breed-ava.active .ph{box-shadow:0 0 0 3px var(--banana-soft);}\n.card-head{display:flex;align-items:center;gap:12px;margin-bottom:24px;}\n.card-av{width:46px;height:46px;border-radius:50%;background:var(--sage-mist);border:2px solid var(--tabac);overflow:hidden;flex-s rid-template-columns:1fr;min-height:auto;}\n  .hero-left{padding:96px 24px 56px;align-items:stretch;}\n  .hero-desc{max-width:100%;}\n  .hero-left .btn-main{max-width:none!important;width:100%;}\n  .early-bird-wrap{width:100%;}\n  .hero-proof{flex-wrap:wrap;gap:22px 28px;}\n  .s-fiche{padding:80px 24px;}\n  h1{font-size:52px;}\n  .hero-right{min-height:480px;padding:40px 24px;}\n  .hero-card{width:100%;max-width:340px;margin-left:0;}\n  .hero-card-stack{margin-left:0;width:100%;max-width:360px;align-items:stretch;}\n  .hero-carousel{justify-content:center;flex-wrap:wrap;}\n  .hero-viva{left:6px;width:150px;opacity:0.92;}\n  .s-diff,.s-compare,.s-how,.s-offers,.s-waitlist,.s-waitlist-full,.s-faq,.s-proof2{padding:80px 24px;}\n  .diff-intro{grid-template-columns:1fr;gap:24px;}\n  h2{font-size:38px;}\n  .diff-grid,.how-steps{grid-template-columns:1fr;}\n  .how-steps::before{display:none;}\n  .offers-grid{grid-template-columns:1fr;}\n  .proof2-cards{grid-template-columns:1fr;}\n  .wl-title,.wl-full-title{font-size:40px;}\n  .wl-form{flex-direction:column;border-radius:4px;}\n  .wl-btn{border-radius:0 0 4px 4px;}\n  footer{grid-template-columns:1fr 1fr;gap:32px;padding:48px 24px;}\n  .compare-table{display:none;}\n  .compare-mobile{display:flex;flex-direction:column;gap:14px;margin-top:40px;}\n  .faq-q{font-size:16px;padding:20px 22px;}\n}\n@media(max-width:560px){\n  h1{font-size:42px;}\n  .fiche-panel{padding:22px;}\n}\n\n/* HAMBURGER MOBILE */\n.nav-burger{display:none;flex-direction:column;gap:5px;background:none;border:none;cursor:pointer;padding:6px;z-index:201;}\n.nav-burger span{display:block;width:22px;height:2px;background:var(--tabac);border-radius:2px;transition:all 0.3s;}\n.nav-burger.open span:nth-child(1){transform:rotate(45deg) translate(5px,5px);}\n.nav-burger.open span:nth-child(2){opacity:0;}\n.nav-burger.open span:nth-child(3){transform:rotate(-45deg) translate(5px,-5px);}\n@media(max-width:900px){\n  .nav-burger{display:flex;}\n  .nav-links{\n    dis  <div class=\"early-bird-wrap\">\n      <div class=\"early-bird-badge\">\n        <div class=\"eb-dot\"><\u002Fdiv>\n        Offre de lancement\n      <\u002Fdiv>\n      <p class=\"early-bird-counter\">\n        <strong id=\"placesLeft\">87<\u002Fstrong> / 100 places au tarif de lancement encore disponibles\n      <\u002Fp>\n      <a href=\"quiz.html\" class=\"btn-main\" style=\"max-width:340px;\">\n        <span>Créer le profil de mon chien<\u002Fspan>\n        <div class=\"btn-price-wrap\">\n          <span class=\"btn-price-main\">12 € / mois<\u002Fspan>\n          <span class=\"btn-price-sub\">à vie · 19€ après le lancement<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fa>\n      <p class=\"hero-fineprint\">Sans engagement · résiliable à tout moment · premier mois offert<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"hero-proof\">\n      <div><div class=\"proof-num\">100%<\u002Fdiv><div class=\"proof-lbl\">Sur-mesure<\u002Fdiv><\u002Fdiv>\n      <div><div class=\"proof-num\">NRC<\u002Fdiv><div class=\"proof-lbl\">+ FEDIAF<\u002Fdiv><\u002Fdiv>\n      <div><div class=\"proof-num\">4×<\u002Fdiv><div class=\"proof-lbl\">Menus / mois<\u002Fdiv><\u002Fdiv>\n      <div><div class=\"proof-num\">0<\u002Fdiv><div class=\"proof-lbl\">Recette toute faite<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"hero-right\">\n    <svg class=\"hero-viva\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 440 500\" fill=\"none\" role=\"img\" aria-label=\"Viva, épagneul breton, mascotte de Kyno\">\n  \n  <g stroke=\"#3A2A20\" stroke-width=\"5\" stroke-linejoin=\"round\" stroke-linecap=\"round\">\n\n    \n    <path d=\"M336 326 q56 -4 72 -50 q10 -28 -16 -36 q-26 -8 -34 22 q-8 30 -38 34 q-4 16 16 30 Z\" fill=\"#BE6B41\"><\u002Fpath>\n\n    \n    <path d=\"M120 470 q-26 -150 28 -208 q40 -42 132 -34 q70 8 86 78 q16 70 -10 164 Z\" fill=\"#FFFFFF\"><\u002Fpath>\n    \n    <path d=\"M250 252 q66 0 84 64 q12 44 4 96 q-44 14 -86 6 q14 -90 -22 -150 q9 -12 16 -16 Z\" fill=\"#BE6B41\"><\u002Fpath>\n\n    \n    <path d=\"M150 470 q-8 -64 8 -104 q24 -22 46 -2 q14 40 8 106 Z\" fill=\"#FFFFFF\"><\u002Fpath>\n    <path d=\"M232 470 q-6 -62 10 -100 q24 -20 44 0 q12 40 8 100 Z\" fill=\"#FFFFFF\"><\u002Fpath>\n    <g stroke-width=\"3.5\">\n      <path d=\"M150 470 h54\" stroke=\"#CFC8BB\"><\u002Fpath>\n      <path d=\"M168 452 v18 M186 452 v18\" stroke=\"#CFC8BB\"><\u002Fpath>\n      <path d=\"M236 470 h54\" stroke=\"#CFC8BB\"><\u002Fpath>\n      <path d=\"M254 452 v18 M272 452 v18\" stroke=\"#CFC8BB\"><\u002Fpath>\n    <\u002Fg>\n\n    \n    <path d=\"M118 150 q-58 8 -64 88 q-4 64 40 104 q40 18 58 -16 q16 -64 6 -132 q-6 -36 -40 -44 Z\" fill=\"#BE6B41\"><\u002Fpath>\n    <path d=\"M320 150 q58 8 64 88 q4 64 -40 104 q-40 18 -58 -16 q-16 -64 -6 -132 q6 -36 40 -44 Z\" fill=\"#BE6B41\"><\u002Fpath>\n    \n    <g stroke=\"#9A5230\" stroke-width=\"3\" fill=\"none\" opacity=\"0.4\">\n      <path d=\"M86 224 q-4 42 18 78\"><\u002Fpath>\n      <path d=\"M354 224 q4 42 -18 78\"><\u002Fpath>\n    <\u002Fg>\n\n    \n    <path d=\"M220 86 q104 0 120 92 q12 74 -36 122 q-38 36 -84 36 q-46 0 -84 -36 q-48 -48 -36 -122 q16 -92 120 -92 Z\" fill=\"#FFFFFF\"><\u002Fpath>\n\n    \n    <path d=\"M220 86 q70 0 102 56 q-30 22 -70 18 q-44 -6 -70 8 q-22 -16 -28 -26 q22 -56 66 -56 Z\" fill=\"#BE6B41\"><\u002Fpath>\n    <path d=\"M256 150 q40 -6 54 22 q10 30 -10 50 q-30 14 -50 -8 q-16 -34 6 -64 Z\" fill=\"#BE6B41\"><\u002Fpath>\n\n    \n    <path d=\"M220 196 q40 0 48 38 q4 34 -48 44 q-52 -10 -48 -44 q8 -38 48 -38 Z\" fill=\"#FFFFFF\"><\u002Fpath>\n\n    \n    <g stroke=\"none\">\n      <ellipse cx=\"160\" cy=\"210\" rx=\"13\" ry=\"8\" fill=\"#EFC3A6\" opacity=\"0.7\"><\u002Fellipse>\n      <ellipse cx=\"286\" cy=\"210\" rx=\"13\" ry=\"8\" fill=\"#EFC3A6\" opacity=\"0.7\"><\u002Fellipse>\n    <\u002Fg>\n\n    \n    <g stroke=\"none\" fill=\"#3A2A20\">\n      <ellipse cx=\"178\" cy=\"168\" rx=\"12\" ry=\"15\"><\u002Fellipse>\n      <ellipse cx=\"262\" cy=\"168\" rx=\"12\" ry=\"15\"><\u002Fellipse>\n    <\u002Fg>\n    <g stroke=\"none\" fill=\"#FFFFFF\">\n      <circle cx=\"183\" cy=\"162\" r=\"4\"><\u002Fcircle>\n      <circle cx=\"267\" cy=\"162\" r=\"4\"><\u002Fcircle>\n    <\u002Fg>\n    <path d=\"M163 147 q15 -9 30 -2\" stroke-width=\"4.5\"><\u002Fpath>\n    <path d=\"M247 145 q15 -8 30 2\" stroke-width=\"4.5\"><\u002Fpath>\n\n    \n    <path d=\"M220 196 q17 0 17 13 q0 11 -17 13 q-17 -2 -17 -13 q0 -13 17 -13 Z\" fill=\"#2E211A\" stroke=\"none\"><\u002Fpath>\n    <path d=\"M220 222 v8\" stroke-width=\"4.5\"><\u002Fpath>\n    <path d=\"M220 230 q-20 13 -38 4\" stroke-width=\"4.5\"><\u002Fpath>\n    <path d=\"M220 230 q20 14 38 3\" stroke-width=\"4.5\"><\u002Fpath>\n    <path d=\"M212 234 q8 18 18 18 q10 0 14 -13 q-16 6 -32 -5 Z\" fill=\"#D98E80\"><\u002Fpath>\n  <\u002Fg>\n<\u002Fsvg>\n    <div class=\"hero-card-stack\">\n      <div class=\"hero-pick\">Choisis une race&nbsp;:<\u002Fdiv>\n      <div class=\"breed-carousel hero-carousel\" id=\"heroBreedChips\"><\u002Fdiv>\n      <div class=\"hero-card\" id=\"heroCard\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  \n<\u002Fsection>\n\n<!-- PREUVE SOCIALE -->\n<section class=\"s-proof2\">\n  <div class=\"proof2-wrap\">\n    <div class=\"s-label\">Ce que disent les premiers membres Kyno<\u002Fdiv>\n    <div class=\"proof2-cards\">\n      <div class=\"proof2-card\">\n        <p class=\"proof2-quote\">« J'avais essayé de cuisiner pour Pixel tout seul mais je ne savais jamais si je faisais juste. Avec Kyno j'ai enfin l'impression de comprendre ce que je lui donne. »<\u002Fp>\n        <p class=\"proof2-author\">Thomas, propriétaire d'un Husky de 3 ans<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"proof2-card\">\n        <p class=\"proof2-quote\">« En 3 semaines son pelage a vraiment changé. Et le fait de savoir exactement ce qu'il mange, c'est rassurant. »<\u002Fp>\n        <p class=\"proof2-author\">Léa, propriétaire d'un Labrador de 5 ans<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- FICHE SANTÉ DÉTAILLÉE -->\n<section class=\"s-fiche\" id=\"fiche\">\n  <div class=\"fiche-head\">\n    <div class=\"s-label\" style=\"justify-content:center;\">Ce que tu reçois<\u002Fdiv>\n    <h2>La fiche santé<br><em>de ton chien.<\u002Fem><\u002Fh2>\n    <p>Chaque semaine, tu reçois le profil complet de ton chien — score santé, répartition nutritionnelle, menus à cuisiner, alertes liées à sa race et compléments ciblés. Choisis une race pour voir un exemple.<\u002Fp>\n  <\u002Fdiv>\n  <div class=\"fiche-stage\">\n    <div class=\"breed-carousel\" id=\"breedChips\"><\u002Fdiv>\n    <div class=\"fiche-panel\" id=\"fichePanel\"><\u002Fdiv>\n  <\u002Fdiv>\n  <p class=\"fiche-note\">Exemple illustratif — ta vraie fiche Kyno est encore plus détaillée. Sans engagement, résiliable à tout moment.<\u002Fp>\n<\u002Fsection>\n\n<!-- LA DIFFÉRENCE -->\n<section class=\"s-diff\" id=\"difference\">\n  <div class=\"diff-intro\">\n    <div>\n      <div class=\"s-label\">Pourquoi Kyno<\u002Fdiv>\n      <h2>Pas une recette.<br><em>Son<\u002Fem> menu.<\u002Fh2>\n    <\u002Fdiv>\n    <p class=\"diff-body\">La plupart des solutions servent à peu près la même chose à tous les chiens. Kyno prend le problème à l'envers&nbsp;: on part de <span class=\"mark\">ton chien<\u002Fspan> — sa race, son âge, son mode de vie, sa santé — et on construit tout autour. Jusqu'aux compléments ciblés et aux ajustements de chaque saison.<\u002Fp>\n  <\u002Fdiv>\n  <div class=\"diff-grid\">\n    <div class=\"diff-card\"><div class=\"diff-n\">01<\u002Fdiv><div class=\"diff-title\">Vraiment sur-mesure<\u002Fdiv><p class=\"diff-desc\">Race, âge, poids, activité, intolérances, ville ou campagne — chaque détail compte. Ton chien reçoit un menu fait pour lui seul, pas pour « un chien de 14 kg ».<\u002Fp><\u002Fdiv>\n    <div class=\"diff-card\"><div class=\"diff-n\">02<\u002Fdiv><div class=\"diff-title\">Saisonnier &amp; adaptatif<\u002Fdiv><p class=\"diff-desc\">L'été, on renforce l'hydratation. L'hiver, la vitamine D. Chaque semaine, les menus suivent les saisons et l'évolution de ton chien — jamais un copier-coller.<\u002Fp><\u002Fdiv>\n    <div class=\"diff-card\"><div class=\"diff-n\">03<\u002Fdiv><div class=\"diff-title\">Préventif &amp; économique<\u002Fdiv><p class=\"diff-desc\">Mieux nourri, ton chien tombe moins souvent malade — et tu passes moins par la case vétérinaire. Surtout&nbsp;: <span class=\"mark mark-sage\">plus d'énergie pour courir<\u002Fspan> et se balader, plus longtemps et plus confortablement.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- COMPARAISON -->\n<section class=\"s-compare\">\n  <div class=\"s-label\">L'impact concret<\u002Fdiv>\n  <h2>Ce que ça change<br><em>pour ton chien.<\u002Fem><\u002Fh2>\n  <table class=\"compare-table\">\n    <thead>\n      <tr>\n        <th style=\"width:40%\">Ce que ça change<\u002Fth>\n        <th class=\"th-kyno\" style=\"width:30%\">Avec Kyno<\u002Fth>\n        <th class=\"th-others\" style=\"width:30%\">Sans Kyno<\u002Fth>\n      <\u002Ftr>\n    <\u002Fthead>\n    <tbody>\n      <tr><td>Besoins nutritionnels couverts avec précision<\u002Ftd><td class=\"td-check\">✓ Calcul NRC / FEDIAF<\u002Ftd><td class=\"td-cross\">✗ Estimation approximative<\u002Ftd><\u002Ftr>\n      <tr><td>Carences et excès détectés en amont<\u002Ftd><td class=\"td-check\">✓ Alertes intégrées au profil<\u002Ftd><td class=\"td-cross\">✗ Découverts trop tard<\u002Ftd><\u002Ftr>\n      <tr><td>Adaptation aux intolérances &amp; pathologies<\u002Ftd><td class=\"td-check\">✓ Intégrée dès le profil<\u002Ftd><td class=\"td-cross\">Partiel ou absent<\u002Ftd><\u002Ftr>\n      <tr><td>Ajustement selon la saison et l'âge<\u002Ftd><td class=\"td-check\">✓ Mensuel et automatique<\u002Ftd><td class=\"td-cross\">✗ Statique<\u002Ftd><\u002Ftr>\n      <tr><td>Prévention des troubles digestifs, cutanés, articulaires<\u002Ftd><td class=\"td-check\">✓ Anticipé dans le plan<\u002Ftd><td class=\"td-cross\"> ss=\"step-desc\">Tu achètes les ingrédients où tu veux et tu cuisines — recettes et dosages fournis. Chaque semaine, un nouveau menu suit la saison et l'évolution de ton chien.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- OFFRES -->\n<section class=\"s-offers\" id=\"offres\">\n  <div class=\"offers-wrap\">\n    <div class=\"s-label\" style=\"justify-content:center;\">Tarifs<\u002Fdiv>\n    <h2>Une seule offre,<br><em>deux moments.<\u002Fem><\u002Fh2>\n  <\u002Fdiv>\n\n  <div class=\"offers-grid\">\n\n    <!-- LANCEMENT -->\n    <div class=\"offer-early early\">\n      <div>\n        <div class=\"eb-offer-badge\"><div class=\"eb-dot\" style=\"width:5px;height:5px;background:var(--banana);border-radius:50%;\"><\u002Fdiv>Tarif de lancement — 100 places<\u002Fdiv>\n        <p class=\"eb-offer-counter\" style=\"margin-top:8px;\"><span id=\"placesLeftOffers\">87<\u002Fspan> / 100 places encore disponibles<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"offer-price\">\n        <div class=\"p-num early\">12<\u002Fdiv>\n        <div class=\"p-detail\">\n          <span class=\"p-cur\">€<\u002Fspan>\n          <span class=\"p-freq early\">/ mois · à vie<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"p-crossed early\">19€<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"offer-name early\">Suivi Continu<\u002Fdiv>\n      <p class=\"offer-tagline early\">Le tarif fondateur, réservé aux 100 premiers membres. Ton prix ne bougera jamais. Environ <strong style=\"color:var(--banana);font-weight:600;\">3 € par menu<\u002Fstrong>, moins de 0,40 € par jour.<\u002Fp>\n      <div class=\"offer-feats early\">\n        <div class=\"feat early\"><div class=\"feat-dot early\"><\u002Fdiv>Rapport nutritionnel complet + premier menu offert<\u002Fdiv>\n        <div class=\"feat early\"><div class=\"feat-dot early\"><\u002Fdiv>Nouveaux menus chaque semaine (4×/mois), à cuisiner toi-même<\u002Fdiv>\n        <div class=\"feat early\"><div class=\"feat-dot early\"><\u002Fdiv>Suivi mensuel de l'évolution de ton chien<\u002Fdiv>\n        <div class=\"feat early\"><div class=\"feat-dot early\"><\u002Fdiv>Compléments ciblés avec dosages précis<\u002Fdiv>\n        <div class=\"feat early\"><div class=\"feat-dot early\"><\u002Fdiv>Alertes liées à sa race et à sa santé<\u002Fdiv>\n        <div class=\"feat early\"><div class=\"feat-dot early\"><\u002Fdiv>Prix garanti à vie, même après le lancement public<\u002Fdiv>\n      <\u002Fdiv>\n      <a href=\"quiz.html\" class=\"offer-btn early\">Créer le profil de mon chien — 12 € / mois →<\u002Fa>\n      <p class=\"offer-fine\">Sans engagement · résiliable à tout moment<\u002Fp>\n    <\u002Fdiv>\n\n    <!-- TARIF PUBLIC (après lancement) -->\n    <div class=\"offer-standard normal\">\n      <div class=\"offer-badge-standard\">Tarif public — après le lancement<\u002Fdiv>\n      <div class=\"offer-price\">\n        <div class=\"p-num normal\">19<\u002Fdiv>\n        <div class=\"p-detail\">\n          <span class=\"p-cur\">€<\u002Fspan>\n          <span class=\"p-freq normal\">/ mois<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"offer-name normal\">Suivi Continu<\u002Fdiv>\n      <p class=\"offer-tagline normal\">Le même service au tarif public, dès l'ouverture officielle de Kyno. Environ <strong style=\"color:var(--sage);font-weight:600;\">4,75 € par menu<\u002Fstrong>, moins de 0,65 € par jour.<\u002Fp>\n      <div class=\"offer-feats normal\">\n        <div class=\"feat normal\"><div class=\"feat-dot normal\"><\u002Fdiv>Rapport nutritionnel complet personnalisé<\u002Fdiv>\n        <div class=\"feat normal\"><div class=\"feat-dot normal\"><\u002Fdiv>Nouveaux menus chaque semaine, à cuisiner toi-même<\u002Fdiv>\n        <div class=\"feat normal\"><div class=\"feat-dot normal\"><\u002Fdiv>Adaptation saisonnière automatique<\u002Fdiv>\n        <div class=\"feat normal\"><div class=\"feat-dot normal\"><\u002Fdiv>Compléments ciblés avec dosages<\u002Fdiv>\n        <div class=\"feat normal\"><div class=\"feat-dot normal\"><\u002Fdiv>Alertes liées à sa race et à sa santé<\u002Fdiv>\n        <div class=\"feat normal\"><div class=\"feat-dot normal\"><\u002Fdiv>Suivi mensuel adaptatif<\u002Fdiv>\n      <\u002Fdiv>\n      <a href=\"#waitlist-full\" class=\"offer-btn normal\" id=\"btnWaitlistOffers\">Être averti à l'ouverture →<\u002Fa>\n      <p class=\"offer-fine\">Sans engagement · résiliable à tout moment<\u002Fp>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- FAQ -->\n<section class=\"s-faq\" id=\"faq\">\n  <div class=\"faq-head\">\n    <div class=\"s-label\" style=\"justify-content:center;\">On répond<\u002Fdiv>\n    <h2>Questions fréquentes.<\u002Fh2>\n  <\u002Fdiv>\n  <div class=\"faq-list\" id=\"faqList\">\n    <div class=\"faq-item\">\n      <button class=\"faq-q\" type=\"button\">Combien de temps faut-il pour cuisiner ?<span class=\"faq-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fspan><\u002Fbutton>\n      <div class=\"faq-a\"><div class=\"faq-a-inner\">Une session de batch cooking d'environ 1h par semaine. Tu cuisines une grande quantité en une fois, tu conserves au frigo pour les 3 premiers jours et au congélateur pour le reste. Pas de cuisine quotidienne.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"faq-item\">\n      <button class=\"faq-q\" type=\"button\">Dois-je arrêter les croquettes ?<span class=\"faq-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fspan><\u002Fbutton>\n      <div class=\"faq-a\"><div class=\"faq-a-inner\">Non, pas forcément. Kyno s'adapte à ton rythme — tu peux commencer en mixte (une partie de ration ménagère, une partie de croquettes) et évoluer à ton rythme. Le plan indique toujours les quantités adaptées à chaque mode.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"faq-item\">\n      <button class=\"faq-q\" type=\"button\">Et si mon chien n'aime pas les recettes ?<span class=\"faq-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fspan><\u002Fbutton>\n      <div class=\"faq-a\"><div class=\"faq-a-inner\">Chaque menu est conçu à partir de tes réponses au quiz — ingrédients que ton chien aime, ce qu'il a déjà mangé, ses intolérances. Et si une recette ne passe pas, tu nous le signales dans ton espace client et on adapte le menu suivant.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"faq-item\">\n      <button class=\"faq-q\" type=\"button\">Est-ce validé par des vétérinaires ?<span class=\"faq-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fspan><\u002Fbutton>\n      <div class=\"faq-a\"><div class=\"faq-a-inner\">Les plans Kyno sont basés sur les références NRC 2006 et FEDIAF 2023 — les mêmes standards utilisés par les nutritionnistes vétérinaires professionnels. Kyno est un outil éducatif et ne remplace pas un suivi vétérinaire, mais les calculs nutritionnels sont rigoureux et sourcés.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"faq-item\">\n      <button class=\"faq-q\" type=\"button\">Faut-il acheter des compléments spéciaux ?<span class=\"faq-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fspan><\u002Fbutton>\n      <div class=\"faq-a\"><div class=\"faq-a-inner\">Oui, un complément minéral et vitaminé (CMV) est indispensable en ration ménagère — c'est environ 2-3€/mois. Il est disponible en magasin bio ou sur internet. Kyno indique exactement lequel utiliser et en quelle quantité selon le poids de ton chien.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"faq-item\">\n      <button class=\"faq-q\" type=\"button\">Quelle différence avec une calculatrice nutritionnelle gratuite en ligne ?<span class=\"faq-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fspan><\u002Fbutton>\n      <div class=\"faq-a\"><div class=\"faq-a-inner\">Les calculatrices gratuites donnent des apports caloriques génériques. Kyno intègre la race, les prédispositions génétiques, la saison, les troubles de santé, les intolérances, le comportement alimentaire et l'environnement de vie — et génère des recettes concrètes avec des quantités précises, pas juste des chiffres.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"faq-item\">\n      <button class=\"faq-q\" type=\"button\">Pourquoi un abonnement mensuel ?<span class=\"faq-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fspan><\u002Fbutton>\n      <div class=\"faq-a\"><div class=\"faq-a-inner\">Parce que les besoins de ton chien évoluent — avec l'âge, la saison, son poids, son activité. Un menu de janvier n'est pas adapté à juillet. L'abonnement inclut 4 nouveaux menus par mois, mis à jour selon l'évolution de ton chien via le chat de l'espace client.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"faq-item\">\n      <button class=\"faq-q\" type=\"button\">Puis-je résilier à tout moment ?<span class=\"faq-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fspan><\u002Fbutton>\n      <div class=\"faq-a\"><div class=\"faq-a-inner\">Oui, sans condition et sans frais. Tu résilies depuis ton espace client en un clic, quand tu veux.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- CTA PRINCIPAL — places dispo -->\n<section class=\"s-waitlist\" id=\"waitlist\">\n  <h2 class=\"wl-title\">Ton chien mérite<br>une nutrition <em>qui lui ressemble.<\u002Fem><\u002Fh2>\n  <p class=\"wl-desc\">Crée son profil en 5 minutes et reçois son premier menu offert. 100 places au tarif de lancement — ton avis nous aide à bâtir le meilleur service de nutrition canine en France.<\u002Fp>\n  <a href=\"quiz.html\" class=\"btn-main\" style=\"font-size:15px;padding:20px 32px;\">\n    <span>Créer le profil de mon chien<\u002Fspan>\n    <div class=\"btn-price-wrap\">\n      <span class=\"btn-price-main\">12 € / mois<\u002Fspan>\n      <span class=\"btn-price-sub\">à vie · offre de lancement<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fa>\n  <p class=\"wl-note\">Premier mois offert · sans engagement · résiliable à tout moment<\u002Fp>\n<\u002Fsection>\n\n<!-- WAITLIST — offre publique / places épuisées (texte adapté dynamiquement par le script) -->\n<section class=\"s-waitlist-full\" id=\"waitlist-full\">\n  <div class=\"wl-full-tag\" id=\"wlFullTag\">Tarif public — à l'ouverture<\u002Fdiv>\n  <h2 class=\"wl-full-title\" id=\"wlFullTitle\">Sois prévenu·e<br>à <em>l'ouverture.<\u002Fem><\u002Fh2>\n  <p class=\"wl-full-desc\" id=\"wlFullDesc\">Laisse ton email pour être prévenu à l'ouverture officielle. Tu recevras une offre exclusive.<\u002Fp>\n  <div class=\"wl-form\" id=\"wl-form-full\">\n    <input class=\"wl-input\" type=\"email\" placeholder=\"ton@email.com\" id=\"wl-email-full\">\n    <button class=\"wl-btn\" onclick=\"submitWaitlistFull()\">Me prévenir →<\u002Fbutton>\n  <\u002Fdiv>\n  <p class=\"wl-success\" id=\"wl-success-full\">Ton email est enregistré ✦ Tu seras prévenu en premier.<\u002Fp>\n  <p class=\"wl- d=\"M70 134 q30 -8 60 0 q-8 30 -30 30 q-22 0 -30 -30Z\" fill=\"#D8C8B4\"/><ellipse cx=\"100\" cy=\"132\" rx=\"13\" ry=\"9\" fill=\"#2E211A\" stroke=\"none\"/><\u002Fg><\u002Fsvg>'\n  },\n  croise: {\n    name:'Nala', bg:'#A6D9B5', meta:'Croisé · 5 ans · 19 kg', season:'Automne',\n    score:84, trend:'↑ +4 ce mois',\n    macros:[['Protéines',62,'var(--sage)'],['Lipides',23,'var(--peach)'],['Glucides',15,'var(--banana)']],\n    meals:[['Poisson blanc + riz + épinards','220 g'],['Huile de colza','4 ml'],['Multivitamines','1 dose']],\n    alerts:[['leaf','Profil équilibré','Maintien du poids de forme'],['activity','Activité modérée','Ration ajustée aux balades']],\n    portrait:'<svg viewBox=\"0 0 200 200\"><g stroke=\"#3A2A20\" stroke-width=\"3.5\" stroke-linejoin=\"round\"><path d=\"M56 56 q-20 8 -16 46 q4 30 24 36 q-2 -40 6 -72 q-6 -14 -14 -10Z\" fill=\"#8B6B4E\"/><path d=\"M144 58 q22 2 22 40 q-2 28 -22 38 q2 -42 -6 -70 q4 -12 6 -8Z\" fill=\"#fff\"/><path d=\"M100 50 q48 0 56 50 q6 40 -18 66 q-18 18 -38 18 q-20 0 -38 -18 q-24 -26 -18 -66 q8 -50 56 -50Z\" fill=\"#fff\"/><path d=\"M100 50 q34 0 48 30 q-22 14 -48 6 q-10 -2 -16 4 q4 -40 16 -40Z\" fill=\"#8B6B4E\"/><ellipse cx=\"124\" cy=\"92\" rx=\"20\" ry=\"24\" fill=\"#8B6B4E\" stroke=\"none\"/><circle cx=\"80\" cy=\"106\" r=\"9\" fill=\"#3A2A20\" stroke=\"none\"/><circle cx=\"120\" cy=\"106\" r=\"9\" fill=\"#3A2A20\" stroke=\"none\"/><ellipse cx=\"100\" cy=\"138\" rx=\"11\" ry=\"8\" fill=\"#2E211A\" stroke=\"none\"/><\u002Fg><\u002Fsvg>'\n  }\n};\n\n// Chiens cartoon plein corps \"façon Viva\" — assis, joyeux, gentils\nfunction bodyDog(p){\n  const ears = {\n    flop:`<path d=\"M118 150 q-58 8 -64 88 q-4 64 40 104 q40 18 58 -16 q16 -64 6 -132 q-6 -36 -40 -44 Z\" fill=\"${p.earL||p.ear}\"/><path d=\"M320 150 q58 8 64 88 q4 64 -40 104 q-40 18 -58 -16 q-16 -64 -6 -132 q6 -36 40 -44 Z\" fill=\"${p.earR||p.ear}\"/>`,\n    pointy:`<path d=\"M178 116 q-36 -52 -60 -92 q-8 42 8 96 q24 16 52 -4 Z\" fill=\"${p.ear}\"/><path d=\"M262 116 q36 -52 60 -92 q8 42 -8 96 q-24 16 -52 -4 Z\" fill=\"${p.ear}\"/>`,\n    bat:`<path d=\"M176 120 q-42 -28 -42 -82 q44 2 76 52 q2 30 -34 30 Z\" fill=\"${p.ear}\"/><path d=\"M264 120 q42 -28 42 -82 q-44 2 -76 52 q-2 30 34 30 Z\" fill=\"${p.ear}\"/>`\n  }[p.earType];\n  const crown = `<path d=\"M220 86 q70 0 102 56 q-30 22 -70 18 q-44 -6 -70 8 q-22 -16 -28 -26 q22 -56 66 -56 Z\" fill=\"${p.fur}\"/>`;\n  const patch = `<path d=\"M256 150 q40 -6 54 22 q10 30 -10 50 q-30 14 -50 -8 q-16 -34 6 -64 Z\" fill=\"${p.fur}\"/>`;\n  return '<svg viewBox=\"0 0 440 500\" fill=\"none\"><g stroke=\"#3A2A20\" stroke-width=\"5\" stroke-linejoin=\"round\" stroke-linecap=\"round\">'\n    + `<path d=\"M336 326 q56 -4 72 -50 q10 -28 -16 -36 q-26 -8 -34 22 q-8 30 -38 34 q-4 16 16 30 Z\" fill=\"${p.fur}\"/>`\n    + `<path d=\"M120 470 q-26 -150 28 -208 q40 -42 132 -34 q70 8 86 78 q16 70 -10 164 Z\" fill=\"${p.body}\"/>`\n    + (p.saddle?`<path d=\"M250 252 q66 0 84 64 q12 44 4 96 q-44 14 -86 6 q14 -90 -22 -150 q9 -12 16 -16 Z\" fill=\"${p.fur}\"/>`:'')\n    + `<path d=\"M150 470 q-8 -64 8 -104 q24 -22 46 -2 q14 40 8 106 Z\" fill=\"${p.body}\"/><path d=\"M232 470 q-6 -62 10 -100 q24 -20 44 0 q12 40 8 100 Z\" fill=\"${p.body}\"/>`\n    + '<g stroke-width=\"3.5\"><path d=\"M150 470 h54\" stroke=\"#CFC8BB\"/><path d=\"M168 452 v18 M186 452 v18\" stroke=\"#CFC8BB\"/><path d=\"M236 470 h54\" stroke=\"#CFC8BB\"/><path d=\"M254 452 v18 M272 452 v18\" stroke=\"#CFC8BB\"/><\u002Fg>'\n    + ears\n    + `<path d=\"M220 86 q104 0 120 92 q12 74 -36 122 q-38 36 -84 36 q-46 0 -84 -36 q-48 -48 -36 -122 q16 -92 120 -92 Z\" fill=\"${p.head}\"/>`\n    + (p.crownMark?crown:'')\n    + (p.eyePatch?patch:'')\n    + `<path d=\"M220 196 q40 0 48 38 q4 34 -48 44 q-52 -10 -48 -44 q8 -38 48 -38 Z\" fill=\"${p.muzzle||'#FFFFFF'}\"/>`\n    + '<g stroke=\"none\"><ellipse cx=\"160\" cy=\"210\" rx=\"13\" ry=\"8\" fill=\"#EFB7A6\" opacity=\"0.75\"/><ellipse cx=\"286\" cy=\"210\" rx=\"13\" ry=\"8\" fill=\"#EFB7A6\" opacity=\"0.75\"/><\u002Fg>'\n    + '<g stroke=\"none\" fill=\"#3A2A20\"><ellipse cx=\"178\" cy=\"168\" rx=\"12\" ry=\"15\"/><ellipse cx=\"262\" cy=\"168\" rx=\"12\" ry=\"15\"/><\u002Fg>'\n    + '<g stroke=\"none\" fill=\"#FFFFFF\"><circle cx=\"183\" cy=\"162\" r=\"4\"/><circle cx=\"267\" cy=\"162\" r=\"4\"/><\u002Fg>'\n    + '<path d=\"M163 147 q15 -9 30 -2\" stroke-width=\"4.5\"/><path d=\"M247 145 q15 -8 30 2\" stroke-width=\"4.5\"/>'\n    + '<path d=\"M220 196 q17 0 17 13 q0 11 -17 13 q-17 -2 -17 -13 q0 -13 17 -13 Z\" fill=\"#2E211A\" stroke=\"none\"/>'\n    + '<path d=\"M220 222 v8\" stroke-width=\"4.5\"/><path d=\"M220 230 q-20 13 -38 4\" stroke-width=\"4.5\"/><path d=\"M220 230 q20 14 38 3\" stroke-width=\"4.5\"/>'\n    + '<path d=\"M212 234 q8 18 18 18 q10 0 14 -13 q-16 6 -32 -5 Z\" fill=\"#D98E80\"/>'\n    + '<\u002Fg><\u002Fsvg>';\n}\nconst PARTS = {\n  epagneul:{ fur:'#BE6B41', body:'#FFFFFF', head:'#FFFFFF', earType:'flop', ear:'#BE6B41', saddle:true, crownMark:true, eyePatch:true },\n  labrador:{ fur:'#D0913F', body:'#E8AE60', head:'#E8AE60', earType:'flop', ear:'#D0913F', muzzle:'#F2CD92' },\n  berger:{ fur:'#2E211A', body:'#C68A43', head:'#C68A43', earType:'pointy', ear:'#2E211A', saddle:true, crownMark:true, muzzle:'#E8C99A' },\n  bouledogue:{ fur:'#A78C77', body:'#C3B19C', head:'#C3B19C', earType:'bat', ear:'#A78C77', muzzle:'#E2D7C8' },\n  croise:{ fur:'#8B6B4E', body:'#FFFFFF', head:'#FFFFFF', earType:'flop', earL:'#8B6B4E', earR:'#FFFFFF', saddle:true, crownMark:true, eyePatch:true }\n};\nObject.keys(BREEDS).forEach(k=>{ if(PARTS[k]) BREEDS[k].portrait = bodyDog(PARTS[k]); });\n\nconst ICONS = {\n  shield:'<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#E08A4B\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3l7 3v5c0 5-3.5 8-7 9-3.5-1-7-4-7-9V6z\"/><path d=\"M9 12l2 2 4-4\"/><\u002Fsvg>',\n  leaf:'<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#5C7A5E\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M11 20A7 7 0 019 6c4-1 8-2 11-5 1 6 0 14-6 17a7 7 0 01-3 2z\"/><path d=\"M2 22c3-3 5-6 9-8\"/><\u002Fsvg>',\n  heart:'<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#C44B78\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20.8 5.6a5.5 5.5 0 00-7.8 0L12 6.6l-1-1a5.5 5.5 0 10-7.8 7.8L12 22l8.8-8.6a5.5 5.5 0 000-7.8z\"/><\u002Fsvg>',\n  activity:'<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#E08A4B\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 12h4l2 6 4-14 2 8h6\"/><\u002Fsvg>'\n};\n\nfunction renderHeroCard(b){\n  const macros = b.macros.map(m=>`<div class=\"bar-row\"><div class=\"bar-meta\"><span>${m[0]}<\u002Fspan><span>${m[1]} %<\u002Fspan><\u002Fdiv><div class=\"bar-track\"><div class=\"bar-fill\" style=\"width:${m[1]}%;background:${m[2]}\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>`).join('');\n  const meals = b.meals.slice(0,2).map(m=>`<div class=\"meal-row\"><span class=\"meal-name\">${m[0]}<\u002Fspan><span class=\"meal-qty\">${m[1]}<\u002Fspan><\u002Fdiv>`).join('');\n  document.getElementById('heroCard').innerHTML = `\n    <div class=\"card-head\">\n      <div class=\"card-av\" style=\"background:${b.bg}\">${b.portrait}<\u002Fdiv>\n      <div><div class=\"card-dog\">${b.name.trim()}<\u002Fdiv><div class=\"card-info\">${b.meta}<\u002Fdiv><\u002Fdiv>\n      <div class=\"card-season\">${b.season}<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"card-score\">\n      <div><div class=\"score-lbl\">Score santé<\u002Fdiv><div class=\"score-val\">${b.score}<span class=\"score-unit\">/100<\u002Fspan><\u002Fdiv><div class=\"score-trend\">${b.trend}<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"card-bars\">${macros}<\u002Fdiv>\n    <div class=\"card-meals\">${meals}<\u002Fdiv>`;\n}\n\nfunction renderFiche(key){\n  const b = BREEDS[key];\n  const macros = b.macros.map(m=>`<div class=\"f-bar\"><div class=\"m\"><span>${m[0]}<\u002Fspan><span>${m[1]} %<\u002Fspan><\u002Fdiv><div class=\"f-track\"><div class=\"f-fill\" style=\"width:${m[1]}%;background:${m[2]}\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>`).join('');\n  const meals = b.meals.map(m=>`<div class=\"f-meal\"><span class=\"n\">${m[0]}<\u002Fspan><span class=\"q\">${m[1]}<\u002Fspan><\u002Fdiv>`).join('');\n  const alerts = b.alerts.map(a=>`<div class=\"f-li\">${ICONS[a[0]]}<div><b>${a[1]}<\u002Fb> — ${a[2]}<\u002Fdiv><\u002Fdiv>`).join('');\n  document.getElementById('fichePanel').innerHTML = `\n    <div class=\"fiche-prow\">\n      <div class=\"fiche-photo\" style=\"background:${b.bg}\">${b.portrait}<\u002Fdiv>\n      <div><div class=\"fiche-pname\">${b.name.trim()}<\u002Fdiv><div class=\"fiche-pmeta\">${b.meta}<\u002Fdiv><\u002Fdiv>\n      <div class=\"fiche-season\">${b.season}<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"fiche-score\">\n      <div><div class=\"lbl\">Score santé<\u002Fdiv><div class=\"val\">${b.score}<small>/100<\u002Fsmall><\u002Fdiv><\u002Fdiv>\n      <div style=\"text-align:right;\"><div class=\"trend\">${b.trend}<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"fiche-block\">\n      <div class=\"fiche-blabel\">Répartition nutritionnelle<\u002Fdiv>\n      <div class=\"f-bars\">${macros}<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"fiche-block\">\n      <div class=\"fiche-blabel\">Menu du jour<\u002Fdiv>\n      <div class=\"f-meals\">${meals}<\u002Fdiv>\n      <div class=\"f-cook\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 2a4 4 0 014 4c0 2-1.5 3-1.5 5h-5C9.5 9 8 8 8 6a4 4 0 014-4z\"/><path d=\"M9 17h6M10 21h4\"/><\u002Fsvg>À cuisiner toi-même · recette et dosages fournis<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"fiche-block\">\n      <div class=\"fiche-blabel\">Alertes &amp; compléments<\u002Fdiv>\n      <div class=\"f-list\">${alerts}<\u002Fdiv>\n    <\u002Fdiv>`;\n}\n\n// Carrousels (hero + fiche) — partagent la même sélection\nfunction buildCarousel(id){\n  const el = document.getElementById(id);\n  if(!el) return;\n  el.innerHTML = Object.keys(BREEDS).map(k=>{\n    const b = BREEDS[k];\n    return `<button class=\"breed-ava\" data-breed=\"${k}\"><span class=\"ph\" style=\"background:${b.bg}\">${b.portrait}<\u002Fspan><span class=\"nm\">${b.name.trim()}<\u002Fspan><\u002Fbutton>`;\n  }).join('');\n  el.querySelectorAll('.breed-ava').forEach(btn=>btn.addEventListener('click',()=>selectBreed(btn.dataset.breed)));\n}\nfunction selectBreed(key){\n  renderHeroCard(BREEDS[key]);\n  renderFiche(key);\n  document.querySelectorAll('.breed-ava').forEach(el=>el.classList.toggle('active', el.dataset.breed===key));\n}\nbuildCarousel('breedChips');\nbuildCarousel('heroBreedChips');\nselectBreed('epagneul');\n<\u002Fscript>\n\n\n\n<script>\nfunction toggleMenu(){\n  var links = document.getElementById('navLinks');\n  var burger = document.getElementById('navBurger');\n  links.classList.toggle('open');\n  burger.classList.toggle('open');\n}\n// Fermer le menu au clic sur un lien\ndocument.querySelectorAll('#navLinks a').forEach(function(a){\n  a.addEventListener('click', function(){\n    document.getElementById('navLinks').classList.remove('open');\n    document.getElementById('navBurger').classList.remove('open');\n  });\n});\n<\u002Fscript>\n<\u002Fbody><\u002Fhtml>"
  </script>
