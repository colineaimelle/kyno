document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

urveiller les articulations (race de chasse active)\" },\n    { ok: true,  text: \"Digestion stable depuis le passage au menu Kyno\" }\n  ],\n  apports: [\n    { nom: 'Calories', unite: 'kcal', valeur: 760, cible: 800, pct: 95, color: '#F2843C' },\n    { nom: 'Protéines', unite: 'g', valeur: 58, cible: 62, pct: 93, color: '#2FA35E' },\n    { nom: 'Lipides', unite: 'g', valeur: 28, cible: 30, pct: 93, color: '#EC6592' },\n    { nom: 'Calcium', unite: 'g', valeur: 9.2, cible: 10, pct: 92, color: '#3E8FC4' },\n    { nom: 'Oméga-3', unite: 'g', valeur: 2.6, cible: 2.8, pct: 93, color: '#FFCE2E' }\n  ],\n  maladies: [],\n  traitements: null,\n  sensibilites: ['Selles molles occasionnelles', 'Léger excès de larmoiement'],\n  allergies: ['Poulet'],\n  intolerances: ['Lactose'],\n  reactions_allergiques: 'jamais',\n  poids_historique: [\n    { label: 'S-5', poids: 13.2 },\n    { label: 'S-4', poids: 13.5 },\n    { label: 'S-3', poids: 13.7 },\n    { label: 'S-2', poids: 13.8 },\n    { label: 'S-1', poids: 13.9 },\n    { label: 'Auj.', poids: 14.0 }\n  ],\n  objectifs: [\n    { nom: 'pelage et peau', progress: 72 },\n    { nom: 'digestion', progress: 88 },\n    { nom: 'santé générale', progress: 64 }\n  ],\n  mode_alimentaire: 'Ration ménagère cuite',\n  budget: '40 € / semaine',\n  temps_prep: '30 min demandées',\n  temps_reel: '28 min',\n  equipement: ['Balance de cuisine', 'Cuit-vapeur', 'Boîtes hermétiques'],\n  recettes: [\n    { moment: 'Menu du jour', color: '#2B3A2E', titre: 'Dinde, patate douce, courgette & épinards', ration: 385,\n      ingredients: [\n        { name: 'Escalope de dinde (vapeur)', qty: '180 g' },\n        { name: 'Patate douce cuite', qty: '90 g' },\n        { name: 'Courgette', qty: '55 g' },\n        { name: 'Épinards', qty: '35 g' },\n        { name: 'Huile de saumon', qty: '3 ml' },\n        { name: 'CMV', qty: '3 g' }\n      ],\n      note: \"Repas complet et équilibré — protéines maigres digestes et oméga-3 (EPA/DHA) pour le pelage de Viva. Même ration matin et soir.\" }\n  ],\n  batch_time: '≈ 35 min de prépa',\n  batch_steps: [\n    { n: 1, text: \"Cuire 1,3 kg d'escalope de dinde à la vapeur, sans matière grasse.\" },\n    { n: 2, text: \"Cuire séparément la patate douce, les courgettes et les épinards.\" },\n    { n: 3, text: \"Laisser tiédir, mélanger, puis peser chaque portion de 385 g à la balance.\" }\n  ],\n  batch_special: \"Ajouter 2 ml d'huile de saumon + 3 g de CMV directement dans le bol au moment du repas, jamais à la cuisson (la chaleur détruit les oméga-3 et les vitamines).\",\n  conserv_frigo: \"3 × 385 g\",\n  conserv_congelo: \"4 × 385 g\",\n  courses: [\n    { cat: 'Viandes & poissons', items: [\n      { name: 'Escalope de dinde', qty: '1,3 kg' }\n    ]},\n    { cat: 'Légumes & féculents', items: [\n      { name: 'Patate douce', qty: '630 g' },\n      { name: 'Courgettes', qty: '385 g' },\n      { name: 'Épinards frais', qty: '245 g' }\n    ]},\n    { cat: 'Compléments', items: [\n      { name: \"Huile de saumon\", qty: '1 flacon' },\n      { name: 'CMV (complément minéral-vitaminé)', qty: '1 pot' }\n    ]}\n  ],\n  cout_semaine: '38 €',\n  historique_menus: [\n    { score: 84, label: 'Semaine du 3 juin', note: 'Menu poulet & courge — pelage en nette amélioration' },\n    { score: 81, label: 'Semaine du 27 mai', note: 'Menu bœuf & carotte — digestion stabilisée' },\n    { score: 78, label: 'Semaine du 20 mai', note: 'Premier menu Kyno — transition réussie' }\n  ]\n};\n\n// ═══════════════════════════════════════════════════════════\n//  INIT\n// ═══════════════════════════════════════════════════════════\n(async function init() {\n  buildCarousel();\n\n  let profile = null;\n  try {\n    if (sb) {\n      const { data: { session } } = await sb.auth.getSession();\n      if (session) {\n        currentUser = session.user;\n        const { data } = await sb.from('user').select('*').eq('email', currentUser.email).single();\n        if (data) profile = data;\n      }\n    }\n  } catch (e) { console.warn('Auth/profil:', e); }\n\n  if (!profile) {\n    if (REQUIRE_AUTH) { window.location.href = 'acces.html'; return; }\n    profile = DEMO_PROFILE; // mode démo\n  }\n\n  userProfile = profile;\n  renderAll(profile);\n  setTimeout(updateCarouselHeight, 80);\n  await loadChatHistory();\n  // Mise à jour derniere_connexion\n  if (sb && currentUser) { sb.from('user').update({ derniere_connexion: new Date().toISOString() }).eq('email', currentUser.email).then(() => {}).catch(() => {}); }\n  document.getElementById('loadingScreen').style.display = 'none';\n})();\n\n// ═══════════════════════════════════════════════════════════\n//  RENDER PRINCIPAL\n// ═══════════════════════════════════════════════════════════\nfunction renderAll(p) {\n  const nom = p.prenom_chien || 'ton chien';\n  document.getElementById('navDogName').textContent = `Espace de ${nom}`;\n  document.getElementById('menuDogName').textContent = nom;\n  document.getElementById('menuRace').textContent = p.race || '—';\n  document.getElementById('chatSub').textContent = `Le suivi de ${nom}`;\n\n  renderSlide1(p);\n  renderSlide2(p);\n  renderSlide3(p);\n  renderSlide4(p);\n  renderRecipes(p);\n  renderCookInfos(p);\n  renderBatch(p);\n  renderCourses(p);\n  renderSavings(p);\n  renderPastWeeks(p);\n\n  // message d'accueil chat (si pas d'historique)\n  if (!Array.isArray(p.chat_history) || !p.chat_history.length) {\n    addMessage('ia', `Salut ! Je suis là pour suivre ${nom} avec toi. Dis-moi comment elle va cette semaine — appétit, selles, énergie, poids — et je recalibre son plan en temps réel.`, true);\n  }\n}\n\n// ─── SLIDE 1 ───\nfunction renderSlide1(p) {\n  document.getElementById('s1Name').textContent = p.prenom_chien || '…';\n  document.getElementById('s1Since').textContent = `Membre depuis ${formatMonth(p.created_at)}`;\n  renderScore(p.score_sante);\n\n  const sexeTxt = p.sexe ? (p.sexe + (p.est_sterilise ? (p.sexe.toLowerCase().startsWith('f') ? ' · stérilisée' : ' · castré') : '')) : null;\n  const items = [\n    { k: 'Race', v: p.race, icon: 'dog' },\n    { k: 'Âge', v: p.age, icon: 'cake' },\n    { k: 'Poids actuel', v: p.poids ? p.poids + ' kg' : null, icon: 'scale' },\n    { k: 'Saison', v: p.saison, icon: 'sun' },\n    { k: 'Sexe', v: sexeTxt, icon: 'heart' },\n    { k: 'Activité', v: p.activite, icon: 'run' }\n  ].filter(i => i.v);\n\n  document.getElementById('s1Infos').innerHTML = items.map(i => `\n    <div class=\"info-card\">\n      <span class=\"info-k\">${ICON_SM[i.icon] || ''} ${i.k}<\u002Fspan>\n      <span class=\"info-v\">${esc(i.v)}<\u002Fspan>\n    <\u002Fdiv>`).join('');\n\n  const bullets = Array.isArray(p.score_bullets) ? p.score_bullets : [];\n  document.getElementById('s1Bullets').innerHTML = bullets.length ? bullets.map(b => `\n    <div class=\"bullet-row\">\n      <div class=\"bullet-mark\" style=\"background:${b.ok ? '#E4F4E8' : '#FFF1BF'};border:1.5px solid ${b.ok ? '#2FA35E' : '#F2843C'};\">\n        <span style=\"color:${b.ok ? '#2FA35E' : '#F2843C'};\">${b.ok ? '✓' : '!'}<\u002Fspan>\n      <\u002Fdiv>\n      <span class=\"bullet-text\">${esc(b.text)}<\u002Fspan>\n    <\u002Fdiv>`).join('') : '<span class=\"empty-note\">Les points clés apparaîtront avec le premier bilan.<\u002Fspan>';\n}\n\nfunction renderScore(score) {\n  const ring = document.getElementById('scoreRing');\n  const numEl = document.getElementById('scoreNum');\n  const labelEl = document.getElementById('scoreLabel');\n  if (score == null) {\n    numEl.textContent = '—';\n    labelEl.textContent = 'En attente';\n    ring.style.strokeDashoffset = RING_DASH;\n    return;\n  }\n  const color = score >= 85 ? '#2FA35E' : score >= 70 ? '#F2843C' : '#EC6592';\n  const label = score >= 85 ? 'Excellent' : score >= 70 ? 'Bonne forme' : score >= 55 ? 'À surveiller' : 'Vigilance';\n  ring.style.stroke = color;\n  labelEl.style.color = color;\n  labelEl.textContent = label;\n  const dur = 1300, start = performance.now();\n  const tick = now => {\n    const t = Math.min(1, (now - start) / dur);\n    const e = 1 - Math.pow(1 - t, 3);\n    const cur = Math.round(score * e);\n    numEl.textContent = cur;\n    ring.style.strokeDashoffset = RING_DASH * (1 - cur / 100);\n    if (t < 1) requestAnimationFrame(tick);\n  };\n  requestAnimationFrame(tick);\n}\n\n// ─── SLIDE 2 ───\nfunction renderSlide2(p) {\n  const macros = Array.isArray(p.apports) ? p.apports : [];\n  const el = document.getElementById('macroList');\n  if (!macros.length) {\n    el.innerHTML = '<span class=\"empty-note\">Les apports s\\'afficheront dès le premier menu de la semaine.<\u002Fspan>';\n    return;\n  }\n  el.innerHTML = macros.map((m, i) => {\n    const pct = m.pct != null ? m.pct : (m.cible ? Math.round((m.valeur / m.cible) * 80) : 0);\n    return `\n    <div class=\"macro\">\n      <div class=\"macro-head\">\n        <span class=\"macro-name\">${esc(m.nom)}<\u002Fspan>\n        <span class=\"macro-val\"><b style=\"color:${m.color}\">${m.valeur}<\u002Fb> / ${m.cible} ${esc(m.unite || '')}<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"macro-track\">\n        <div class=\"macro-fill\" data-w=\"${Math.min(100, pct)}\" style=\"width:0;background:${m.color}\"><\u002Fdiv>\n        <div class=\"macro-target\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>`;\n  }).join('');\n}\n\n// ─── SLIDE 3 ───\nfunction renderSlide3(p) {\n  const grid = document.getElementById('bilanGrid');\n  const cards = [];\n  const maladies = toArr(p.maladies);\n  const traitements = toArr(p.traitements);\n  const tracas = toArr(p.sensibilites);\n  const allergies = toArr(p.allergies);\n  const intol = toArr(p.intolerances);\n\n  cards.push(bilanCard('Maladies diagnostiquées', maladies, 'badge-orange', 'Aucune maladie diagnostiquée'));\n  cards.push(bilanCard('Traitements', traitements, 'badge-orange', 'Aucun traitement en cours'));\n  cards.push(bilanCard('Petits tracas', tracas, 'badge-bleu', 'Aucun tracas signalé'));\n  cards.push(bilanCard('Allergies', allergies, 'badge-rose', 'Aucune allergie connue'));\n  cards.push(bilanCard('Intolérances', intol, 'badge-rose', 'Aucune intolérance connue'));\n  grid.innerHTML = cards.join('');\n\n  document.getElementById('vetAlert').innerHTML = maladies.length ? `\n    <div class=\"alerte-vet\">\n      <svg viewBox=\"0 0 24 24\" width=\"18\" height=\"18\" fill=\"none\" stroke=\"#C26312\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none;margin-top:1px;\"><path d=\"M10.3 3.2 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.2a2 2 0 0 0-3.4 0Z\"><\u002Fpath><path d=\"M12 9v4\"><\u002Fpath><path d=\"M12 17h.01\"><\u002Fpath><\u002Fsvg>\n      <p>Une ou plusieurs maladies sont renseignées. Ton vétérinaire doit valider tout changement alimentaire avant de commencer.<\u002Fp>\n    <\u002Fdiv>` : '';\n\n  renderWeight(p);\n}\n\nfunction bilanCard(title, arr, badgeClass, emptyMsg) {\n  const content = arr.length\n    ? arr.map(x => `<span class=\"badge ${badgeClass}\">${esc(x)}<\u002Fspan>`).join('')\n    : `<span class=\"empty-note\">${emptyMsg}<\u002Fspan>`;\n  return `<div class=\"bilan-card\"><div class=\"bilan-card-title\">${title}<\u002Fdiv><div class=\"badges-wrap\">${content}<\u002Fdiv><\u002Fdiv>`;\n}\n\nfunction renderWeight(p) {\n  const hist = Array.isArray(p.poids_historique) ? p.poids_historique : [];\n  const wrap = document.getElementById('weightSvgWrap');\n  if (hist.length < 2) {\n    wrap.innerHTML = '<span class=\"empty-note\">La courbe de poids apparaîtra après quelques semaines de suivi.<\u002Fspan>';\n    document.getElementById('weightNow').textContent = p.poids ? p.poids + ' kg' : '—';\n    document.getElementById('weightDelta').style.display = 'none';\n    return;\n  }\n  const W = 600, H = 150, padX = 30, padY = 24;\n  const vals = hist.map(h => h.poids);\n  const min = Math.min(...vals), max = Math.max(...vals);\n  const range = (max - min) || 1;\n  const stepX = (W - padX * 2) / (hist.length - 1);\n  const pts = hist.map((h, i) => {\n    const x = padX + i * stepX;\n    const y = padY + (H - padY * 2) * (1 - (h.poids - min) / range);\n    return { x, y, h };\n  });\n  const poly = pts.map(pt => `${pt.x.toFixed(1)},${pt.y.toFixed(1)}`).join(' ');\n  const area = `${padX},${H - padY} ` + poly + ` ${W - padX},${H - padY}`;\n\n  wrap.innerHTML = `\n    <div class=\"weight-tip\" id=\"weightTip\"><\u002Fdiv>\n    <svg viewBox=\"0 0 ${W} ${H}\" style=\"width:100%;height:auto;display:block;overflow:visible;\">\n      <defs><linearGradient id=\"wGrad\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">\n        <stop offset=\"0%\" stop-color=\"#2FA35E\" stop-opacity=\"0.18\"/><stop offset=\"100%\" stop-color=\"#2FA35E\" stop-opacity=\"0\"/>\n      <\u002FlinearGradient><\u002Fdefs>\n      <polygon points=\"${area}\" fill=\"url(#wGrad)\"><\u002Fpolygon>\n      <polyline points=\"${poly}\" fill=\"none\" stroke=\"#2FA35E\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpolyline>\n      ${pts.map((pt, i) => `\n        <circle class=\"wpoint\" cx=\"${pt.x.toFixed(1)}\" cy=\"${pt.y.toFixed(1)}\" r=\"5\" fill=\"#fff\" stroke=\"#2FA35E\" stroke-width=\"2.5\"\n          data-x=\"${pt.x.toFixed(1)}\" data-y=\"${pt.y.toFixed(1)}\" data-label=\"${esc(pt.h.label)}\" data-poids=\"${pt.h.poids}\"><\u002Fcircle>\n        <text x=\"${pt.x.toFixed(1)}\" y=\"${H - 6}\" text-anchor=\"middle\" font-family=\"Manrope\" font-size=\"11\" font-weight=\"600\" fill=\"#7E8C80\">${esc(pt.h.label)}<\u002Ftext>\n      `).join('')}\n    <\u002Fsvg>`;\n\n  const tip = document.getElementById('weightTip');\n  wrap.querySelectorAll('.wpoint').forEach(c => {\n    const show = () => {\n      tip.textContent = `${c.dataset.poids} kg`;\n      tip.style.left = c.dataset.x / W * wrap.offsetWidth + 'px';\n      tip.style.top = c.dataset.y / H * wrap.querySelector('svg').getBoundingClientRect().height + 'px';\n      tip.style.opacity = '1';\n    };\n    c.addEventListener('mouseenter', show);\n    c.addEventListener('click', show);\n    c.addEventListener('mouseleave', () => tip.style.opacity = '0');\n  });\n\n  const first = vals[0], last = vals[vals.length - 1];\n  const delta = +(last - first).toFixed(1);\n  document.getElementById('weightNow').textContent = last + ' kg';\n  const dEl = document.getElementById('weightDelta');\n  dEl.style.display = 'inline-block';\n  const up = delta > 0, flat = delta === 0;\n  dEl.textContent = (up ? '↑ +' : flat ? '→ ' : '↓ ') + (flat ? 'stable' : Math.abs(delta) + ' kg') + (flat ? '' : ' depuis le début');\n  dEl.style.background = flat ? '#EDF2E8' : '#E4F4E8';\n  dEl.style.color = flat ? '#7E8C80' : '#1d7a45';\n}\n\n// ─── SLIDE 4 ───\nconst OBJ_META = {\n  'santé générale':       { icon: '🌿', label: 'Santé générale' },\n  'perte de poids':       { icon: '⚖️', label: 'Perte de poids' },\n  'prise de masse':       { icon: '💪', label: 'Prise de masse' },\n  'pelage et peau':       { icon: '✨', label: 'Pelage & peau' },\n  'digestion':            { icon: '🌱', label: 'Digestion' },\n  'sport et performance': { icon: '🏃', label: 'Sport & performance' },\n  'senior et longévité':  { icon: '🏠', label: 'Senior & longévité' },\n  'problème spécifique':  { icon: '🔍', label: 'Problème spécifique' }\n};\n\nfunction normObjectives(raw) {\n  // Supporte tableau de chaînes OU tableau d'objets {nom, progress}\n  return toArrRaw(raw).map(o => typeof o === 'string' ? { nom: o, progress: null } : o);\n}\n\nfunction renderSlide4(p) {\n  const objs = normObjectives(p.objectifs);\n  selectedObjectives = objs.map(o => o.nom);\n\n  const row = document.getElementById('objRow');\n  const prog = document.getElementById('objProgress');\n  if (!objs.length) {\n    row.innerHTML = '<span class=\"empty-note\">Aucun objectif défini. Clique sur « Changer d\\'objectif » pour en choisir.<\u002Fspan>';\n    prog.innerHTML = '';\n  } else {\n    row.innerHTML = objs.map(o => {\n      const m = OBJ_META[o.nom] || { icon: '•', label: cap(o.nom) };\n      return `<span class=\"obj-badge\">${m.icon} ${esc(m.label)}<\u002Fspan>`;\n    }).join('');\n    prog.innerHTML = objs.map(o => {\n      const m = OBJ_META[o.nom] || { icon: '•', label: cap(o.nom) };\n      const pct = o.progress != null ? o.progress : 0;\n      return `\n        <div class=\"obj-prog\">\n          <div class=\"obj-prog-head\">\n            <span class=\"obj-prog-name\">${m.icon} ${esc(m.label)}<\u002Fspan>\n            <span class=\"obj-prog-pct\">${pct}%<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"obj-prog-track\"><div class=\"obj-prog-fill\" data-w=\"${pct}\" style=\"width:0\"><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>`;\n    }).join('');\n  }\n\n  // Historique des 3 derniers scores santé (depuis historique_menus)\n  const menus = Array.isArray(p.historique_menus) ? p.historique_menus.slice(0, 3) : [];\n  const sh = document.getElementById('scoreHistory');\n  if (!menus.length) {\n    sh.innerHTML = '<span class=\"empty-note\">L\\'historique des scores apparaîtra après quelques semaines.<\u002Fspan>';\n  } else {\n    sh.innerHTML = menus.map(m => {\n      const color = m.score >= 85 ? '#2FA35E' : m.score >= 70 ? '#F2843C' : '#EC6592';\n      return `<div class=\"sh-chip\"><span class=\"sh-score\" style=\"color:${color}\">${m.score}<\u002Fspan><span class=\"sh-date\">${esc(shortLabel(m.label))}<\u002Fspan><\u002Fdiv>`;\n    }).join('');\n  }\n}\n\n// ─── RECETTES ───\nfunction renderRecipes(p) {\n  const recipes = Array.isArray(p.recettes) && p.recettes.length ? p.recettes.slice(0, 1) : null;\n  const c = document.getElementById('recipesContainer');\n  if (!recipes) {\n    const nom = p.prenom_chien || 'ton chien';\n    c.innerHTML = `<div class=\"menu-pending\">\n      <div class=\"menu-pending-icon\"><svg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"#2FA35E\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 2v2\"><\u002Fpath><path d=\"M5 10a7 7 0 0 1 14 0v6a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2Z\"><\u002Fpath><path d=\"M5 16h14\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n      <div class=\"menu-pending-title\">Le menu de ${esc(nom)} est en préparation<\u002Fdiv>\n      <div class=\"menu-pending-sub\">Tu recevras un email dès qu'il est prêt. En attendant, le chat est là pour tes questions.<\u002Fdiv>\n    <\u002Fdiv>`;\n    return;\n  }\n  c.innerHTML = `<div class=\"recipes-grid\">${recipes.map(r => {\n    const dark = r.color !== '#FFCE2E';\n    const txt = dark ? '#fff' : '#2B3A2E';\n    const isMatin = (r.moment || '').toLowerCase().includes('matin');\n    const isJour = /jour|menu/.test((r.moment || '').toLowerCase());\n    const icon = isMatin\n      ? `<svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"${txt}\" stroke-width=\"2.2\" stroke-linecap=\"round\"><circle cx=\"12\" cy=\"12\" r=\"4\"><\u002Fcircle><path d=\"M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4\"><\u002Fpath><\u002Fsvg>`\n      : isJour\n      ? `<svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"${txt}\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 11h18M5 11a7 7 0 0 1 14 0M5 11v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6M12 4v3\"><\u002Fpath><\u002Fsvg>`\n      : `<svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"${txt}\" stroke-width=\"2.2\" stroke-linecap=\"round\"><path d=\"M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z\"><\u002Fpath><\u002Fsvg>`;\n    const ings = Array.isArray(r.ingredients) ? r.ingredients : [];\n    return `<div class=\"recipe-card\">\n      <div class=\"recipe-header\" style=\"background:${r.color || '#E4F4E8'};\">\n        <span class=\"recipe-moment\" style=\"color:${txt};\">${icon} ${esc(r.moment || '')}<\u002Fspan>\n        <span class=\"recipe-ration-label\" style=\"color:${txt};opacity:.85;\">Ration / jour<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"recipe-body\">\n        <div class=\"recipe-title-row\">\n          <span class=\"recipe-title\">${esc(r.titre || '')}<\u002Fspan>\n          <div class=\"recipe-ration\"><span class=\"recipe-ration-num\">${r.ration ?? '—'}<\u002Fspan><span class=\"recipe-ration-unit\">g<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"recipe-ings\">${ings.map(ing => `<div class=\"recipe-ing\"><span class=\"recipe-ing-name\">${esc(ing.name || '')}<\u002Fspan><span class=\"recipe-ing-qty\">${esc(ing.qty || '')}<\u002Fspan><\u002Fdiv>`).join('')}<\u002Fdiv>\n        ${r.note ? `<div class=\"recipe-note\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"#1d7a45\" stroke-width=\"2.2\" stroke-linecap=\"round\" style=\"flex:none;margin-top:1px;\"><path d=\"M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z\"><\u002Fpath><path d=\"M2 21c0-3 1.85-5.36 5.08-6\"><\u002Fpath><\u002Fsvg><p>${esc(r.note)}<\u002Fp><\u002Fdiv>` : ''}\n      <\u002Fdiv>\n    <\u002Fdiv>`;\n  }).join('')}<\u002Fdiv>`;\n}\n\nfunction renderCookInfos(p) {\n  const items = [\n    { k: 'Mode de cuisine', v: p.mode_alimentaire, sub: '', color: '#FFCE2E', bg: '#FFF1BF', icon: 'pot' },\n    { k: 'Temps de prépa', v: p.temps_prep, sub: p.temps_reel ? `réel : ${p.temps_reel}` : '', color: '#3E8FC4', bg: '#DCECF6', icon: 'clock' },\n    { k: 'Équipement', v: Array.isArray(p.equipement) && p.equipement.length ? p.equipement.join(', ') : p.equipement, sub: '', color: '#2FA35E', bg: '#E4F4E8', icon: 'tool' }\n  ].filter(i => i.v);\n  document.getElementById('cookRow').innerHTML = items.map(i => `\n    <div class=\"cook-card\">\n      <div class=\"cook-icon\" style=\"background:${i.bg};border:1.5px solid ${i.color};\">${ICON_COOK[i.icon]}<\u002Fdiv>\n      <div><div class=\"cook-k\">${i.k}<\u002Fdiv><div class=\"cook-v\">${esc(i.v)}${i.sub ? ` <small>· ${esc(i.sub)}<\u002Fsmall>` : ''}<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>`).join('');\n}\n\n// ─── BATCH ───\nfunction renderBatch(p) {\n  const steps = Array.isArray(p.batch troke-linejoin=\"round\"><rect width=\"14\" height=\"20\" x=\"5\" y=\"2\" rx=\"2\"><\u002Frect><path d=\"M5 11h14\"><\u002Fpath><path d=\"M9 6v1M9 15v1\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n      <div><div class=\"conserv-title\">Boîtes frigo<\u002Fdiv><div class=\"conserv-desc\"><b>${esc(frigo)}<\u002Fb> · à conserver 3 jours max.<\u002Fdiv><\u002Fdiv><\u002Fdiv>` : ''}\n    ${congelo ? `<div class=\"conserv-box\">\n      <span class=\"conserv-icon\"><svg viewBox=\"0 0 24 24\" width=\"18\" height=\"18\" fill=\"none\" stroke=\"#2FA35E\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 2v20M2 12h20M4.9 4.9l14.2 14.2M19.1 4.9 4.9 19.1\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n      <div><div class=\"conserv-title\">Sachets congélo<\u002Fdiv><div class=\"conserv-desc\"><b>${esc(congelo)}<\u002Fb> · jusqu'à 6 semaines.<\u002Fdiv><\u002Fdiv><\u002Fdiv>` : ''}\n  ` : '<span class=\"empty-note\">Les consignes de conservation arriveront avec le menu.<\u002Fspan>';\n}\n\n// ─── COURSES ───\nfunction renderCourses(p) {\n  const cats = Array.isArray(p.courses) ? p.courses : [];\n  coursesData = cats.flatMap(c => (c.items || []).map(it => ({ ...it, cat: c.cat })));\n  const grid = document.getElementById('coursesGrid');\n  grid.innerHTML = cats.length ? cats.map(c => `\n    <div class=\"courses-cat\">\n      <div class=\"courses-cat-label\">${esc(c.cat || '')}<\u002Fdiv>\n      ${(c.items || []).map(it => `<div class=\"course-item\"><span class=\"course-name\">${esc(it.name || '')}<\u002Fspan><span class=\"course-qty\">${esc(it.qty || '')}<\u002Fspan><\u002Fdiv>`).join('')}\n    <\u002Fdiv>`).join('') : '<span class=\"empty-note\">La liste de courses sera disponible avec le premier menu.<\u002Fspan>';\n  document.getElementById('coutSemaine').textContent = p.cout_semaine || '—';\n}\n\nfunction renderSavings(p) {\n  const block = document.getElementById('savingsBlock');\n  const days = daysSince(p.created_at);\n  const coutWeek = parseFloat(String(p.cout_semaine || '').replace(',', '.').replace(/[^\\d.]/g, ''));\n  if (!days || isNaN(coutWeek)) { block.style.display = 'none'; return; }\n  const coutDay = coutWeek / 7;\n  const ecoDogChef = Math.max(0, Math.round((7 - coutDay) * days));\n  const ecoCroq = Math.max(0, Math.round((3.5 - coutDay) * days));\n  block.style.display = 'block';\n  block.innerHTML = `\n    <div class=\"savings-title\">Tes économies depuis le début avec Kyno<\u002Fdiv>\n    <div class=\"savings-row\">\n      <div class=\"saving-line\">\n        <div class=\"saving-vs\">vs livraison type Dog Chef <small>~ 7 € / jour<\u002Fsmall><\u002Fdiv>\n        <div class=\"saving-amt\">${ecoDogChef} €<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"saving-line\">\n        <div class=\"saving-vs\">vs croquettes premium <small>~ 3,50 € / jour<\u002Fsmall><\u002Fdiv>\n        <div class=\"saving-amt\">${ecoCroq} €<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"savings-since\">Cumulé depuis ton inscription, il y a ${days} jours.<\u002Fdiv>`;\n}\n\nfunction renderPastWeeks(p) {\n  const weeks = Array.isArray(p.historique_menus) ? p.historique_menus : [];\n  document.getElementById('pastWeeksContainer').innerHTML = weeks.length ? weeks.map(w => {\n    const color = w.score >= 85 ? '#2FA35E' : w.score >= 70 ? '#F2843C' : '#EC6592';\n    return `<div class=\"past-week\">\n      <div class=\"past-score\" style=\"color:${color};border-color:${color};background:${color}1a;\">${w.score}<\u002Fdiv>\n      <div class=\"past-info\"><div class=\"past-week-label\">${esc(w.label)}<\u002Fdiv><div class=\"past-week-note\">${esc(w.note || '')}<\u002Fdiv><\u002Fdiv>\n      <button class=\"past-revoir\" onclick=\"reviewWeek('${esc(w.label)}')\">\n        <svg viewBox=\"0 0 24 24\" width=\"13\" height=\"13\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z\"><\u002Fpath><circle cx=\"12\" cy=\"12\" r=\"3\"><\u002Fcircle><\u002Fsvg>\n        Revoir\n      <\u002Fbutton>\n    <\u002Fdiv>`;\n  }).join('') : '<span class=\"empty-note\">Aucun menu précédent pour le moment.<\u002Fspan>';\n}\nfunction reviewWeek(label) { toggleChat(true); addMessage('user', `Je veux revoir le menu : ${label}`); setTimeout(() => addMessage('ia', `Bien sûr ! Je te renvoie le détail du menu « ${label} » par email tout de suite. Tu veux que je le réutilise cette semaine ?`), 700); }\n\n// ═══════════════════════════════════════════════════════════\n//  CARROUSEL\n// ═══════════════════════════════════════════════════════════\nfunction buildCarousel() {\n  document.getElementById('carDots').innerHTML = Array.from({ length: SLIDE_COUNT }, (_, i) =>\n    `<button class=\"cdot${i === 0 ? ' active' : ''}\" onclick=\"goSlide(${i})\" aria-label=\"Slide ${i+1}\"><\u002Fbutton>`).join('');\n}\nfunction updateCarouselHeight() {\n  const slides = document.querySelectorAll('.slide');\n  const vp = document.querySelector('.carousel-viewport');\n  if (slides[curSlide] && vp) vp.style.height = slides[curSlide].scrollHeight + 'px';\n}\nfunction goSlide(i) {\n  curSlide = (i + SLIDE_COUNT) % SLIDE_COUNT;\n  document.getElementById('carTrack').style.transform = `translateX(-${curSlide * 100}%)`;\n  document.querySelectorAll('.cdot').forEach((d, j) => d.classList.toggle('active', j === curSlide));\n  updateCarouselHeight();\n  setTimeout(animateBars, 60);\n}\nfunction moveSlide(dir) { goSlide(curSlide + dir); }\nfunction animateBars() {\n  document.querySelectorAll('.macro-fill[data-w], .obj-prog-fill[data-w]').forEach(el => {\n    el.style.width = el.dataset.w + '%';\n  });\n}\n// barres animées au premier rendu aussi\nwindow.addEventListener('load', () => setTimeout(animateBars, 400));\n\n// swipe mobile\n(function () {\n  let x0 = null;\n  const vp = () => document.querySelector('.carousel-viewport');\n  document.addEventListener('touchstart', e => { if (e.target.closest('.carousel-viewport')) x0 = e.touches[0].clientX; }, { passive: true });\n  document.addEventListener('touchend', e => {\n    if (x0 === null) return;\n    const dx = e.changedTouches[0].clientX - x0;\n    if (Math.abs(dx) > 50) moveSlide(dx < 0 ? 1 : -1);\n    x0 = null;\n  });\n})();\n\n// scroll horizontal trackpad / molette\n(function () {\n  let last = 0;\n  document.querySelector('.carousel-viewport') && void 0;\n  document.addEventListener('wheel', e => {\n    if (!e.target.closest('.carousel-viewport')) return;\n    if (Math.abs(e.deltaX) <= 30) return;\n    e.preventDefault();\n    const now = Date.now();\n    if (now - last < 400) return;\n    last = now;\n    moveSlide(e.deltaX > 0 ? 1 : -1);\n  }, { passive: false });\n})();\n\n// keyboard arrows\ndocument.addEventListener('keydown', e => {\n  if (document.activeElement && ['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) return;\n  if (e.key === 'ArrowLeft') { e.preventDefault(); moveSlide(-1); }\n  if (e.key === 'ArrowRight') { e.preventDefault(); moveSlide(1); }\n});\n\n// ═══════════════════════════════════════════════════════════\n//  ACCORDÉONS\n// ═══════════════════════════════════════════════════════════\nfunction toggleAccordion(name) {\n  const body = document.getElementById(name + 'Body');\n  const plus = document.getElementById(name + 'Plus');\n  const open = body.classList.toggle('open');\n  plus.style.transform = open ? 'rotate(45deg)' : 'rotate(0deg)';\n}\n\n// ═══════════════════════════════════════════════════════════\n//  COURSES — COPIER\n// ═══════════════════════════════════════════════════════════\nfunction copyList() {\n  if (!coursesData.length) return;\n  const txt = coursesData.map(c => `${c.name} — ${c.qty}`).join('\\n');\n  try { navigator.clipboard && navigator.clipboard.writeText(txt); } catch (e) {}\n  const lbl = document.getElementById('copyLabel');\n  lbl.textContent = 'Copiée ✓';\n  setTimeout(() => lbl.textContent = 'Copier la liste', 1800);\n}\n\n// ═══════════════════════════════════════════════════════════\n//  MODALE OBJECTIFS\n// ═══════════════════════════════════════════════════════════\nfunction openObjModal() {\n  const nom = userProfile?.prenom_chien || 'ton chien';\n  document.getElementById('objModalSub').textContent = `Sélectionne les objectifs de ${nom}. Le chat ajustera son plan au prochain point dans 15 jours.`;\n  document.getElementById('objOptions').innerHTML = Object.entries(OBJ_META).map(([key, m]) => {\n    const sel = selectedObjectives.includes(key);\n    return `<button class=\"obj-option${sel ? ' selected' : ''}\" data-obj=\"${key}\" onclick=\"toggleObjOption('${key}')\">\n      <span class=\"obj-option-icon\">${m.icon}<\u002Fspan>\n      <span class=\"obj-option-text\">${m.label}<\u002Fspan>\n      <span class=\"obj-option-check\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n    <\u002Fbutton>`;\n  }).join('');\n  document.getElementById('objModal').classList.add('open');\n}\nfunction closeObjModal() { document.getElementById('objModal').classList.remove('open'); }\nfunction toggleObjOption(key) {\n  const i = selectedObjectives.indexOf(key);\n  if (i >= 0) selectedObjectives.splice(i, 1); else selectedObjectives.push(key);\n  const btn = document.querySelector(`.obj-option[data-obj=\"${key}\"]`);\n  if (btn) btn.classList.toggle('selected');\n}\nasync function saveObjectives() {\n  // conserve la progression existante quand l'objectif est gardé\n  const prev = normObjectives(userProfile.objectifs);\n  userProfile.objectifs = selectedObjectives.map(nom => {\n    const found = prev.find(o => o.nom === nom);\n    return { nom, progress: found ? found.progress : 0 };\n  });\n  renderSlide4(userProfile);\n  setTimeout(animateBars, 60);\n  closeObjModal();\n  try { if (sb && currentUser) await sb.from('user').update({ objectifs: userProfile.objectifs }).eq('email', currentUser.email); } catch (e) { console.warn(e); }\n  toggleChat(true);\n  const labels = selectedObjectives.map(k => (OBJ_META[k] || {}).label || k).join(', ');\n  addMessage('ia', `C'est noté ✦ Nouveaux objectifs : ${labels}. J'ajuste le plan de ${userProfile.prenom_chien || 'ton chien'} dès le prochain menu.`);\n}\ndocument.getElementById('objModal').addEventListener('click', e => { if (e.target.id === 'objModal') closeObjModal(); });\n\n// ═══════════════════════════════════════════════════════════\n//  CHAT\n// ═══════════════════════════════════════════════════════════\nasync function loadChatHistory() {\n  const nom = (userProfile && userProfile.prenom_chien) || 'ton chien';\n  if (!userProfile || !Array.isArray(userProfile.chat_history) || !userProfile.chat_history.length) {\n    addMessage('ia', `Bonjour ! Je suis Kyno, ton assistant nutrition. Pose-moi tes questions sur ${nom} !`, true);\n    return;\n  }\n  document.getElementById('chatMessages').innerHTML = '';\n  chatHistory = [];\n  userProfile.chat_history.forEach(msg => {\n    addMessage(msg.role === 'user' ? 'user' : 'ia', msg.content);\n    chatHistory.push({ role: msg.role, content: msg.content });\n  });\n  addMessage('ia', `Bonjour ! Comment va ${nom} depuis notre dernière rencontre ? 🐾`);\n}\nasync function saveChatHistory() {\n  if (!sb || !currentUser) return;\n  try { await sb.from('user').update({ chat_history: chatHistory }).eq('email', currentUser.email); } catch (e) { console.warn('save chat', e); }\n}\n\nconst SUGGESTIONS = ['Tout va bien', 'Selles un peu molles', 'Moins d\\'appétit', 'A pris du poids'];\nfunction addSuggestions() {\n  const zone = document.getElementById('chatMessages');\n  const wrap = document.createElement('div');\n  wrap.className = 'chat-suggest';\n  wrap.id = 'chatSuggest';\n  wrap.innerHTML = SUGGESTIONS.map(s => `<button class=\"suggest-chip\" onclick=\"useSuggestion('${s.replace(/'/g, \"\\\\'\")}')\">${s}<\u002Fbutton>`).join('');\n  zone.appendChild(wrap);\n  zone.scrollTop = zone.scrollHeight;\n}\nfunction useSuggestion(s) { document.getElementById('chatInput').value = s; handleSend(); }\n\nasync function handleSend() {\n  const input = document.getElementById('chatInput');\n  const msg = input.value.trim();\n  if (!msg) return;\n  document.getElementById('chatSuggest')?.remove();\n  addMessage('user', msg);\n  input.value = '';\n  document.getElementById('sendBtn').disabled = true;\n  chatHistory.push({ role: 'user', content: msg });\n  await saveChatHistory();\n  showTyping();\n\n  let replied = false;\n  // Backend de chat (si présent en production)\n  try {\n    const res = await fetch('/api/chat', {\n      method: 'POST', headers: { 'Content-Type': 'application/json' },\n      body: JSON.stringify({ messages: chatHistory, profile: userProfile, email: currentUser?.email })\n    });\n    if (res.ok) {\n      const data = await res.json();\n      if (data && data.success && data.reply) {\n        removeTyping(); addMessage('ia', data.reply);\n        chatHistory.push({ role: 'assistant', content: data.reply });\n        await saveChatHistory(); replied = true;\n      }\n    }\n  } catch (e) { /* pas de backend en démo */ }\n\n  if (!replied) {\n    setTimeout(() => {\n      removeTyping();\n      const reply = localReply(msg);\n      addMessage('ia', reply);\n      chatHistory.push({ role: 'assistant', content: reply });\n      saveChatHistory();\n    }, 900);\n  }\n  document.getElementById('sendBtn').disabled = false;\n}\n\nfunction localReply(msg) {\n  const nom = userProfile?.prenom_chien || 'ton chien';\n  const m = msg.toLowerCase();\n  if (m.includes('selle') || m.includes('diarrh') || m.includes('molle')) return `Merci pour le retour. Je vais alléger un peu les fibres et privilégier des protéines très digestes sur le prochain menu de ${nom}. Si ça persiste plus de 48h, on en parle à ton vétérinaire.`;\n  if (m.includes('appétit') || m.includes('mange') || m.includes('mange pas')) return `Compris. Je vais varier les protéines et ajuster les portions pour redonner de l'appétit à ${nom}. Tu as remarqué un changement de routine ou de température ces derniers jours ?`;\n  if (m.includes('poids') || m.includes('kg') || m.includes('gros') || m.includes('maigr')) return `Noté pour le poids. Je recalcule la ration de ${nom} au gramme près et j'ajuste le ratio lipides/protéines sur le menu à venir.`;\n  if (m.includes('bien') || m.includes('super') || m.includes('nickel') || m.includes('top')) return `Génial ! Je garde le cap alors. Je reviens vers toi dans 15 jours pour le prochain point — mais écris-moi quand tu veux si quelque chose change pour ${nom} 🐾`;\n  if (m.includes('énergie') || m.includes('fatigu') || m.includes('mou')) return `Merci. Je vais renforcer légèrement l'apport énergétique et les oméga-3 pour soutenir ${nom}. On surveille ça ensemble la semaine prochaine.`;\n  return `Bien reçu ✦ Je prends ça en compte pour le suivi de ${nom} et j'ajusterai son plan si besoin. Y a-t-il autre chose que tu as remarqué (appétit, selles, énergie, poids) ?`;\n}\n\nfunction addMessage(type, text, withSuggest) {\n  const zone = document.getElementById('chatMessages');\n  const div = document.createElement('div');\n  div.className = type === 'ia' ? 'msg-ia' : 'msg-user';\n  div.innerHTML = `<span class=\"msg-sender ${type === 'ia' ? 'ia' : 'user'}\">${type === 'ia' ? 'Kyno' : 'Toi'}<\u002Fspan>\n    <div class=\"${type === 'ia' ? 'bubble-ia' : 'bubble-user'}\">${type === 'ia' ? renderIaText(text) : esc(text)}<\u002Fdiv>`;\n  zone.appendChild(div);\n  zone.scrollTop = zone.scrollHeight;\n  if (withSuggest) addSuggestions();\n  if (type === 'ia' && !document.getElementById('chatPanel').classList.contains('open')) {\n    document.getElementById('chatUnread').style.display = 'flex';\n  }\n}\nfunction showTyping() {\n  const zone = document.getElementById('chatMessages');\n  const div = document.createElement('div');\n  div.className = 'msg-ia'; div.id = 'typingBubble';\n  div.innerHTML = `<span class=\"msg-sender ia\">Kyno<\u002Fspan><div class=\"typing-dots\"><div class=\"typing-dot\"><\u002Fdiv><div class=\"typing-dot\"><\u002Fdiv><div class=\"typing-dot\"><\u002Fdiv><\u002Fdiv>`;\n  zone.appendChild(div); zone.scrollTop = zone.scrollHeight;\n}\nfunction removeTyping() { document.getElementById('typingBubble')?.remove(); }\n\nfunction toggleChat(force) {\n  const panel = document.getElementById('chatPanel');\n  const btn = document.getElementById('chatToggleBtn');\n  const open = force !== undefined ? force : !panel.classList.contains('open');\n  panel.classList.toggle('open', open);\n  btn.classList.toggle('is-open', open);\n  btn.setAttribute('aria-label', open ? 'Fermer le chat' : 'Ouvrir le chat');\n  if (open) {\n    document.getElementById('chatUnread').style.display = 'none';\n    const zone = document.getElementById('chatMessages');\n    zone.scrollTop = zone.scrollHeight;\n  }\n}\ndocument.getElementById('chatInput').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); } });\n\n// ═══════════════════════════════════════════════════════════\n//  NAV MENU\n// ═══════════════════════════════════════════════════════════\ndocument.getElementById('userBtn').addEventListener('click', e => { e.stopPropagation(); document.getElementById('userMenu').classList.toggle('open'); });\ndocument.addEventListener('click', () => document.getElementById('userMenu').classList.remove('open'));\nfunction closeUserMenu() { document.getElementById('userMenu').classList.remove('open'); }\nasync function handleLogout() { try { if (sb) await sb.auth.signOut(); } catch (e) {} window.location.href = 'acces.html'; }\n\n// keyboard nav carousel\ndocument.addEventListener('keydown', e => {\n  if (document.getElementById('objModal').classList.contains('open')) { if (e.key === 'Escape') closeObjModal(); return; }\n  if (document.activeElement === document.getElementById('chatInput')) return;\n  if (e.key === 'ArrowLeft') moveSlide(-1);\n  if (e.key === 'ArrowRight') moveSlide(1);\n});\n\n// ═══════════════════════════════════════════════════════════\n//  ICONS + UTILS\n// ═══════════════════════════════════════════════════════════\nconst ICON_SM = {\n  dog: '<svg viewBox=\"0 0 24 24\" width=\"11\" height=\"11\" fill=\"none\" stroke=\"#7E8C80\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"vertical-align:-1px\"><path d=\"M10 5.2 8 4 5.5 6 4 9v4l2 4h12l2-4V9l-1.5-3L16 4l-2 1.2\"><\u002Fpath><path d=\"M9 13v.01M15 13v.01\"><\u002Fpath><\u002Fsvg>',\n  cake: '<svg viewBox=\"0 0 24 24\" width=\"11\" height=\"11\" fill=\"none\" stroke=\"#7E8C80\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"vertical-align:-1px\"><path d=\"M20 21v-8a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8M4 16s1-1 2-1 2 1 4 1 3-1 4-1 2 1 2 1M12 4v3\"><\u002Fpath><\u002Fsvg>',\n  scale: '<svg viewBox=\"0 0 24 24\" width=\"11\" height=\"11\" fill=\"none\" stroke=\"#7E8C80\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"vertical-align:-1px\"><path d=\"M12 3v18M5 7h14M7 7l-3 7h6ZM17 7l3 7h-6Z\"><\u002Fpath><\u002Fsvg>',\n  sun: '<svg viewBox=\"0 0 24 24\" width=\"11\" height=\"11\" fill=\"none\" stroke=\"#7E8C80\" stroke-width=\"2\" stroke-linecap=\"round\" style=\"vertical-align:-1px\"><circle cx=\"12\" cy=\"12\" r=\"4\"><\u002Fcircle><path d=\"M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4\"><\u002Fpath><\u002Fsvg>',\n  heart: '<svg viewBox=\"0 0 24 24\" width=\"11\" height=\"11\" fill=\"none\" stroke=\"#7E8C80\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"vertical-align:-1px\"><path d=\"M19 14c1.5-1.5 3-3.2 3-5.5A3.5 3.5 0 0 0 12 6 3.5 3.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7Z\"><\u002Fpath><\u002Fsvg>',\n  run: '<svg viewBox=\"0 0 24 24\" width=\"11\" height=\"11\" fill=\"none\" stroke=\"#7E8C80\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"vertical-align:-1px\"><path d=\"M13 4a1 1 0 1 0 0 2 1 1 0 0 0 0-2ZM7 21l3-4 4 2 1-5-4-3 5-2M13 9l3 1 3-2\"><\u002Fpath><\u002Fsvg>'\n};\nconst ICON_COOK = {\n  pot: '<svg viewBox=\"0 0 24 24\" width=\"18\" height=\"18\" fill=\"none\" stroke=\"#7a4d12\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 9h18M5 9v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9M8 9V6M16 9V6\"><\u002Fpath><\u002Fsvg>',\n  clock: '<svg viewBox=\"0 0 24 24\" width=\"18\" height=\"18\" fill=\"none\" stroke=\"#1f5a82\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 7v5l3 2\"><\u002Fpath><\u002Fsvg>',\n  tool: '<svg viewBox=\"0 0 24 24\" width=\"18\" height=\"18\" fill=\"none\" stroke=\"#1d7a45\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14.7 6.3a4 4 0 0 0-5.4 5.4l-6 6 2 2 6-6a4 4 0 0 0 5.4-5.4l-2.3 2.3-2-2Z\"><\u002Fpath><\u002Fsvg>'\n};\nconst ICON_TAG = {\n  clock: '<svg viewBox=\"0 0 24 24\" width=\"13\" height=\"13\" fill=\"none\" stroke=\"#7a4d12\" stroke-width=\"2.2\" stroke-linecap=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 7v5l3 2\"><\u002Fpath><\u002Fsvg>',\n  list: '<svg viewBox=\"0 0 24 24\" width=\"13\" height=\"13\" fill=\"none\" stroke=\"#1f5a82\" stroke-width=\"2.2\" stroke-linecap=\"round\"><path d=\"M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01\"><\u002Fpath><\u002Fsvg>',\n  scale: '<svg viewBox=\"0 0 24 24\" width=\"13\" height=\"13\" fill=\"none\" stroke=\"#1d7a45\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3v18M5 7h14M7 7l-3 7h6ZM17 7l3 7h-6Z\"><\u002Fpath><\u002Fsvg>'\n};\n\nfunction toArr(val) {\n  if (Array.isArray(val)) return val.filter(Boolean);\n  if (typeof val === 'string' && val.trim() && val.toLowerCase() !== 'jamais' && val.toLowerCase() !== 'aucun' && val.toLowerCase() !== 'non') return val.split(',').map(s => s.trim()).filter(Boolean);\n  return [];\n}\nfunction toArrRaw(val) { if (Array.isArray(val)) return val.filter(Boolean); if (typeof val === 'string' && val.trim()) { const s = val.trim(); if (s.startsWith('[')) { try { const p = JSON.parse(s); if (Array.isArray(p)) return p.filter(Boolean); } catch(e) {} } return s.split(',').map(x => x.trim()).filter(Boolean); } return []; }\nfunction cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : ''; }\nfunction esc(t) { if (t == null) return ''; return String(t).replace(/&/g, '&amp;').replace(/<\u002Fg, '&lt;').replace(/>/g, '&gt;'); }\nfunction renderIaText(t) { if (t == null) return ''; return String(t).replace(/&/g, '&amp;').replace(/<\u002Fg, '&lt;').replace(/>/g, '&gt;').replace(/\\*\\*(.*?)\\*\\*/g, '<strong>$1<\u002Fstrong>').replace(/\\n/g, '<br>'); }\nfunction formatMonth(iso) { if (!iso) return 'récemment'; try { return new Date(iso).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' }); } catch (e) { return 'récemment'; } }\nfunction daysSince(iso) { if (!iso) return 0; const d = Math.floor((Date.now() - new Date(iso).getTime()) / 86400000); return d > 0 ? d : 0; }\nfunction shortLabel(s) { return String(s || '').replace(/^Semaine du /i, ''); }\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
